# Nodaro Community Edition — self-contained docker-compose
#
# Zero cloud accounts: Postgres (Supabase image) + GoTrue auth + PostgREST +
# MinIO storage + Redis all run locally. Database migrations apply themselves
# on first boot. Sign-up is email + password.
#
# Run:    docker compose -f docker-compose.community.yml up
# Open:   http://localhost:3000  (install health: http://localhost:3000/setup)
# Logs:   docker compose -f docker-compose.community.yml logs -f
# Stop:   docker compose -f docker-compose.community.yml down
#
# The app image is PULLED, not built — first boot downloads ~2.4 GB rather
# than compiling for 5-10 minutes. Build from source instead with:
#     docker compose -f docker-compose.community.yml build
# (needed if you changed the code, PUBLIC_URL, or the Supabase keys — see the
# note on the `nodaro` service).
#
# .env is OPTIONAL for local play — every value below has a working default.
# To actually generate media, connect a provider — either click "Connect
# nodaro.ai" in the app (OAuth, no key), or add at least one key to .env:
#   NODARO_API_KEY=...     (a personal API token from app.nodaro.ai → Settings → API)
#   KIE_API_KEY=...        (kie.ai — broadest model coverage)
#   REPLICATE_API_TOKEN=...
#
# SECURITY — before exposing this stack to a network:
#   1. Run `node tools/generate-selfhost-keys.mjs >> .env` to replace the
#      default JWT secret + anon/service keys (the defaults are public
#      knowledge by definition).
#   2. Set POSTGRES_PASSWORD, DATABASE_URL, and the MinIO credentials
#      (R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY) to fresh values.
#   NOTE: changing SUPABASE_ANON_KEY requires rebuilding the app image
#   (docker compose build) — Vite inlines it into the frontend at build time.
#
# If you set POSTGRES_PASSWORD, also set DATABASE_URL + the GoTrue/PostgREST
# connection strings are derived from it automatically below.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nodaro-postgres-pw}
    volumes:
      - db-data:/var/lib/postgresql/data
      # First-init only: aligns the Supabase internal role passwords
      # (supabase_auth_admin, authenticator, ...) with POSTGRES_PASSWORD.
      # Without it GoTrue/PostgREST crash-loop on "password authentication
      # failed". Init scripts do NOT re-run on an existing db-data volume —
      # to change POSTGRES_PASSWORD later, wipe the volume or ALTER USER
      # manually as supabase_admin.
      - ./docker/selfhost/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  auth:
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-nodaro-postgres-pw}@db:5432/postgres
      GOTRUE_SITE_URL: ${PUBLIC_URL:-http://localhost:3000}
      API_EXTERNAL_URL: ${PUBLIC_URL:-http://localhost:3000}/supabase/auth/v1
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-nodaro-community-default-jwt-secret-change-me-please}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # No SMTP on a local stack — accounts are usable immediately after
      # sign-up. Wire GOTRUE_SMTP_* and set this to "false" to require
      # email confirmation.
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-nodaro-postgres-pw}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:-nodaro-community-default-jwt-secret-change-me-please}

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:-nodaro-minio}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:-nodaro-minio-secret}
    ports:
      # Web console (optional): http://localhost:9001. The S3 API itself is
      # NOT host-published — the app reaches it as minio:9000 on the compose
      # network, and the browser reads media through Caddy's /storage/* proxy
      # (see R2_PUBLIC_URL below), so one origin serves app + media.
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  nodaro:
    # Pulls a prebuilt image so the first boot is a download, not a 5-10 minute
    # compile. `latest` tracks main; pin the :<sha> tag for a reproducible
    # install.
    image: ${NODARO_IMAGE:-ghcr.io/nodaroai/nodaro-community:latest}
    # Build from source instead with:
    #     docker compose -f docker-compose.community.yml build
    # Required if you changed the code, OR if you changed PUBLIC_URL or the
    # Supabase keys — the frontend inlines VITE_* at BUILD time, so the
    # published image carries the localhost defaults below and cannot pick up
    # new values at runtime.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_URL:-http://localhost:3000}
        VITE_EDITION: community
        # The bundled Supabase stack is reached through the app's own origin
        # (Caddy routes /supabase/auth/v1 + /supabase/rest/v1 to the auth and
        # rest containers). Point these at a managed supabase.com project
        # instead to skip the bundled stack entirely.
        VITE_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:3000/supabase}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzU0Nzg0MDAwLCJleHAiOjIwNzAxNDQwMDB9.Z1_aDD7opHbwv6f8yrHK0ptlIM2tg1ulhXsggLuDyqo}
    restart: unless-stopped
    ports:
      - "3000:3000"   # Caddy serves both frontend + /v1/* API on the same port
    volumes:
      # App data: the auto-generated instance encryption key lives here. It
      # must survive restarts and upgrades — everything encrypted with it
      # (pasted provider keys, social tokens) is unreadable without it.
      - app-data:/data/nodaro
    environment:
      EDITION: community
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # In-container, localhost:3000 is this container's own Caddy, which
      # routes /supabase/* to the auth/rest containers — so backend and
      # browser share one Supabase URL.
      SUPABASE_URL: ${SUPABASE_URL:-http://localhost:3000/supabase}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3NTQ3ODQwMDAsImV4cCI6MjA3MDE0NDAwMH0.1S--a7iJ0v6nNEKWYcqAfE3-xI0iZ30ypsFs_xrLLbA}
      # Self-host migration runner (start.sh): applies supabase/migrations/
      # before the API starts. Keep the password segment in sync with
      # POSTGRES_PASSWORD if you change it.
      RUN_MIGRATIONS_ON_BOOT: ${RUN_MIGRATIONS_ON_BOOT:-true}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:nodaro-postgres-pw@db:5432/postgres}
      REDIS_URL: redis://redis:6379
      INTERNAL_ORCHESTRATOR_SECRET: ${INTERNAL_ORCHESTRATOR_SECRET:-}
      # Instance encryption key (provider keys pasted on /setup, social OAuth
      # tokens). Leave empty and the app generates one on first boot and keeps
      # it in the app-data volume — back that volume up with the database.
      # SOCIAL_ENCRYPTION_KEY is the older name; either works.
      NODARO_ENCRYPTION_KEY: ${NODARO_ENCRYPTION_KEY:-}
      SOCIAL_ENCRYPTION_KEY: ${SOCIAL_ENCRYPTION_KEY:-}
      # Storage defaults to the bundled MinIO (media on your disk, zero cloud
      # accounts). Setting R2_ACCOUNT_ID + the R2_* keys in .env switches to
      # Cloudflare R2 — clear R2_ENDPOINT/R2_FORCE_PATH_STYLE when you do.
      R2_ENDPOINT: ${R2_ENDPOINT:-http://minio:9000}
      R2_FORCE_PATH_STYLE: ${R2_FORCE_PATH_STYLE:-true}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-nodaro-minio}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-nodaro-minio-secret}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-nodaro-assets}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-http://localhost:3000/storage/nodaro-assets}
      # Host path of this folder — lets the setup screen show users WHERE the
      # .env lives. Set by the shell running compose; harmless if empty.
      NODARO_INSTALL_DIR: ${PWD:-}
      # Which Nodaro cloud this instance connects to (OAuth + generation).
      # Empty = the code default (https://app.nodaro.ai). Override in .env for
      # staging soaks: NODARO_CLOUD_URL=https://next.nodaro.ai
      NODARO_CLOUD_URL: ${NODARO_CLOUD_URL:-}
      # nodaro.ai as a provider like the others: a personal API token from
      # app.nodaro.ai (Settings -> API). Alternative to "Connect nodaro.ai".
      NODARO_API_KEY: ${NODARO_API_KEY:-}
      KIE_API_KEY: ${KIE_API_KEY:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      # Keys for the vendor-direct nodes — AI Avatar / Cinematic Avatar
      # (HeyGen), Relight & Switch (Beeble), Web Scrape (Apify). Optional even
      # when you use those nodes: a connected install runs them through
      # nodaro.ai (billed to the connected account) when the key is empty.
      # Every key here can also be pasted on /setup — the env value wins.
      HEYGEN_API_KEY: ${HEYGEN_API_KEY:-}
      BEEBLE_API_KEY: ${BEEBLE_API_KEY:-}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      db:
        condition: service_healthy
      auth:
        condition: service_started
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  redis-data:
  db-data:
  minio-data:
  app-data:
