name: CI

on:
  # Feature branches are covered by the pull_request event (which tests the
  # merge result), so we DON'T also run on their push — that doubled every PR's
  # CI. `push` runs for dev (the post-merge full suite — decided 2026-10-13:
  # PRs into dev are to run only the tests their change can affect; until the
  # repository variable TEST_SELECT_ENFORCE is `true` they run in shadow mode,
  # the full suite plus the selector's report) and for main (the migrate gate;
  # tests there are skipped when the tree already passed on dev).
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# PR runs: a newer commit cancels the superseded run. Pushes never cancel:
# every dev commit needs its own full run so a failure lands on the PR that
# caused it — and a shared group would also drop the PENDING run when a third
# arrives, so dev pushes are grouped per commit. main keeps one group (its
# migrate job must always complete).
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.ref == 'refs/heads/dev' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

# Skip youtube-dl-exec's postinstall binary download. No CI job executes the
# binary (the backend tests mock youtube-dl-exec), and the upstream CDN
# intermittently 504s — failing `npm ci` and forcing fully-billed reruns.
env:
  YOUTUBE_DL_SKIP_DOWNLOAD: "1"
  # onnxruntime-node's postinstall fetches the CUDA 12 / TensorRT libraries from
  # NuGet on linux/x64 unless told to skip. The face detector runs on the CPU
  # binaries the package already carries, so every install skips it.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  # Classifies the PR's changed paths so the two expensive suites only run
  # when their tree (or anything shared) changed. Frontend Tests + Backend
  # Tests are ~70% of every CI run's billable minutes; most PRs touch one
  # side only. SAFETY: required checks gated by a job-level `if` conclude
  # "skipped", which SATISFIES branch protection (unlike workflow-level
  # `paths:`, which leaves them "Expected" and blocks the merge forever).
  # Unknown paths (packages/, root config, tools/) fail SAFE: both run.
  # Push events (dev, main) always classify as everything. HOW the test jobs
  # then test — shadow / affected / post-merge / verified / full — is the
  # `mode` output, decided by tools/test-select/ci-mode.mjs (any doubt → full).
  # PRs into dev are `shadow` (the full suite runs; the selector's choice is
  # reported and checked for misses) until the repository variable
  # TEST_SELECT_ENFORCE is exactly `true`, which makes them `affected`.
  changes:
    name: Diff Gate
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
      actions: read
      contents: read
    outputs:
      frontend: ${{ steps.gate.outputs.frontend }}
      backend: ${{ steps.gate.outputs.backend }}
      testdedup: ${{ steps.gate.outputs.testdedup }}
      mode: ${{ steps.mode.outputs.mode }}
      reason: ${{ steps.mode.outputs.reason }}
    steps:
      - name: Classify changed paths
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            { echo "frontend=true"; echo "backend=true"; echo "testdedup=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          count=$(printf '%s\n' "$files" | wc -l)
          # The files API caps at 3000 entries — if we're near it, assume the
          # diff is bigger than we can see and run everything.
          if [ "$count" -ge 2900 ]; then
            { echo "frontend=true"; echo "backend=true"; echo "testdedup=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          frontend=false backend=false testdedup=false
          while IFS= read -r f; do
            # The test de-dup harness's inputs: the @test-watches globs of
            # tools/__tests__/test-dedup-equivalence-vitest.test.mjs (`**` as
            # `*`, which crosses `/` here). A guard in
            # tools/__tests__/test-dedup-equivalence.test.mjs holds the two equal.
            case "$f" in
              tools/test-dedup/*|tools/__tests__/test-dedup-*|tools/__tests__/fixtures/test-dedup/*|tools/test-select/annotations.mjs|package.json|package-lock.json|.github/workflows/ci.yml) testdedup=true ;; # test-dedup inputs
            esac
            # First match wins. backend/ comes before the markdown rule: the
            # generated skills (backend/skills/**/*.md) are read by backend
            # tests, and a PR that regenerated them once skipped the suite and
            # left a stale snapshot failing on dev (#1693).
            case "$f" in
              backend/*|supabase/*) backend=true ;;
              docs/*|*.md) ;;                                  # affects neither suite
              .github/workflows/ci.yml|.github/actions/*) frontend=true; backend=true ;;
              .github/*) ;;                                    # other workflows: neither
              frontend/*) frontend=true ;;
              *) frontend=true; backend=true ;;                # packages/, root, unknown: both
            esac
          done <<< "$files"
          { echo "frontend=$frontend"; echo "backend=$backend"; echo "testdedup=$testdedup"; } >> "$GITHUB_OUTPUT"
          echo "changed=$count frontend=$frontend backend=$backend testdedup=$testdedup"
      # The mode steps must never fail the Diff Gate: it is on main's migrate
      # path. A transient failure leaves `mode` empty, and the test jobs'
      # Select step treats an empty mode as a full run.
      - uses: actions/checkout@v5
        continue-on-error: true
        with:
          persist-credentials: false
          sparse-checkout: tools/test-select
      - uses: actions/setup-node@v5
        continue-on-error: true
        with:
          node-version: 22
      - name: Decide the test mode
        id: mode
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_SELECT_ENFORCE: ${{ vars.TEST_SELECT_ENFORCE }}
        run: node tools/test-select/ci-mode.mjs

  prepare-packages:
    name: Prepare Shared Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm 11
        run: corepack enable npm && corepack prepare npm@11.12.1 --activate
      - name: Install workspace dependencies
        run: npm ci
      - name: Build shared packages once
        run: npm run build:packages
      - name: Package verified build outputs
        run: node tools/ci-build-artifact.mjs pack packages "$RUNNER_TEMP/ci-build-packages"
      - uses: actions/upload-artifact@v5
        with:
          name: ci-build-packages
          path: ${{ runner.temp }}/ci-build-packages/
          retention-days: 7
          overwrite: true
          compression-level: 0
          if-no-files-found: error

  frontend-test-shards:
    name: Frontend Tests (${{ matrix.shard }}/4)
    timeout-minutes: 45
    needs: [changes, prepare-packages]
    # Four shards per suite (decided 2026-10-14, from the §5.0 capacity
    # experiment on 2-vCPU runners: backend 37 → 8.4 min, frontend 32 → 11 min
    # at 4 shards, for ~20 % more runner-minutes). The fan-in job below keeps
    # the required check's name.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.prepare-packages.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    # Enable only after validating the disposable pool; forks stay hosted.
    # A named same-repository pilot branch can opt in before general routing.
    runs-on: ${{ needs.changes.outputs.mode == 'verified' && 'ubuntu-slim' || github.repository == 'nodaroai/app.nodaro.ai-internal' && (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RAILWAY_ENABLED == 'true' || vars.CI_RAILWAY_PILOT_BRANCH != '' && github.head_ref == vars.CI_RAILWAY_PILOT_BRANCH) && fromJSON('["self-hosted", "linux", "x64", "nodaro-ci"]') || 'ubuntu-latest' }}
    env:
      VERIFIED: ${{ needs.changes.outputs.mode == 'verified' }}
    steps:
      - name: Already verified
        if: env.VERIFIED == 'true'
        env:
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          printf '### Frontend Tests: verified\n\n%s\n' "$REASON" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Require successful preparation
        if: env.VERIFIED != 'true'
        env:
          DEPENDENCIES: ${{ toJSON(needs) }}
        run: echo "$DEPENDENCIES" | jq -e 'all(.[]; .result == "success")'
      - uses: actions/checkout@v5
        if: env.VERIFIED != 'true'
        with:
          persist-credentials: false
          # the merge commit and its first parent: Select diffs them
          fetch-depth: 2
      - uses: actions/setup-node@v5
        if: env.VERIFIED != 'true'
        with:
          node-version: 22
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: false
          cache-dependency-path: package-lock.json
      # Hosted preparation populates this cache. Disposable runners only read
      # it, avoiding cache uploads on the test job's completion path.
      - name: Restore npm downloads on Railway
        if: env.VERIFIED != 'true' && runner.environment == 'self-hosted'
        uses: actions/cache/restore@v4
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-x64-npm-${{ hashFiles('package-lock.json') }}
      - name: Pin npm 11
        if: env.VERIFIED != 'true'
        run: corepack enable npm && corepack prepare npm@11.12.1 --activate
      - name: Install workspace dependencies
        if: env.VERIFIED != 'true'
        run: npm ci
      - name: Restore shared packages
        id: build-packages
        if: env.VERIFIED != 'true'
        uses: ./.github/actions/restore-ci-build
        with:
          kind: packages
      - name: Select tests
        id: select
        if: ${{ env.VERIFIED != 'true' && !cancelled() && steps.build-packages.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.changes.outputs.mode }}
          REASON: ${{ needs.changes.outputs.reason }}
          # The registry rule's own shadow period (tools/test-select/registry.mjs,
          # decided 2026-10-16): narrowed selection only when this is `enforce`.
          TEST_SELECT_REGISTRY_RULE: ${{ vars.TEST_SELECT_REGISTRY_RULE }}
        run: |
          if [ "$MODE" = "affected" ]; then
            node tools/test-select/cli.mjs --project frontend --merge-commit \
              --list "$RUNNER_TEMP/selected-frontend.txt" --json "$RUNNER_TEMP/selection-frontend.json" --graph-out "$RUNNER_TEMP/graph-frontend.json" --registry-list "$RUNNER_TEMP/registry-frontend.txt" \
              --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"
          elif [ "$MODE" = "shadow" ]; then
            # Shadow mode must never change a result: a selector that cannot
            # run makes this a plain full run, not a red job (the last
            # selection= line written wins). The crash is still evidence
            # against a clean shadow week, so it is written where the shadow
            # check would write and uploaded the same way.
            if ! node tools/test-select/cli.mjs --project frontend --merge-commit \
              --list "$RUNNER_TEMP/selected-frontend.txt" --json "$RUNNER_TEMP/selection-frontend.json" --graph-out "$RUNNER_TEMP/graph-frontend.json" --registry-list "$RUNNER_TEMP/registry-frontend.txt" \
              --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT" --shadow 2> "$RUNNER_TEMP/select-frontend.err"; then
              cat "$RUNNER_TEMP/select-frontend.err" >&2
              echo "selection=full" >> "$GITHUB_OUTPUT"
              printf '### Frontend Tests: full\n\nshadow mode: the selector could not run — running everything\n' >> "$GITHUB_STEP_SUMMARY"
              FIRST_LINE="$(grep -m1 -E '^[A-Za-z]*Error( \[[A-Z_]+\])?: ' "$RUNNER_TEMP/select-frontend.err" || grep -m1 . "$RUNNER_TEMP/select-frontend.err" || true)" node -e '
                const msg = (process.env.FIRST_LINE || "no error output").trim()
                require("fs").writeFileSync(process.argv[1], JSON.stringify({ project: "frontend", error: "selector crashed: " + msg, crashed: true }) + "\n")' \
                "$RUNNER_TEMP/shadow-frontend.json" || true
            else
              cat "$RUNNER_TEMP/select-frontend.err" >&2
            fi
          else
            # An empty or unknown mode (the Diff Gate failed) is a full run.
            case "$MODE" in post-merge) sel=post-merge ;; *) sel=full ;; esac
            echo "selection=$sel" >> "$GITHUB_OUTPUT"
            printf '### Frontend Tests: %s\n\n%s\n' "$sel" "${REASON:-the Diff Gate gave no mode — running everything}" >> "$GITHUB_STEP_SUMMARY"
          fi
      # Same reasoning as the shared/prompts suites in Backend Tests: a
      # workspace-package suite that only runs locally silently rots.
      # @nodaro/picker-ui's tests assert catalog/registry parity against
      # @nodaro/prompts + @nodaro/shared — exactly the cross-package drift
      # shape — so they gate here, inside an existing REQUIRED check. They
      # run on every run, affected mode included: their tests read files
      # outside packages/ (tools/picker-art/, frontend/public/picker-art),
      # which no package-path rule can see.
      - name: Run @nodaro/picker-ui test suite
        if: ${{ env.VERIFIED != 'true' && !cancelled() && steps.build-packages.outcome == 'success' && matrix.shard == 1 }}
        run: npm run test --workspace=@nodaro/picker-ui
      # No run here measures coverage (it adds ~40% wall time and gates
      # nothing); nightly-coverage.yml does — decided 2026-10-13.
      # The pass cache (§5.6, decided 2026-10-14): a test file whose exact
      # inputs (its content, every module it loads, the files it declares it
      # reads, the environment) already passed is not run again on a PR. Dev's
      # post-merge runs record their passes too — they seed every PR — but
      # never skip anything: they are the evidence main's `verified` trusts.
      # Every step here is best-effort: without a plan the shard runs as before.
      - name: Restore the pass cache
        if: ${{ env.VERIFIED != 'true' && !cancelled() && steps.select.outcome == 'success' && github.event_name == 'pull_request' && steps.select.outputs.selection != 'shadow' }}
        uses: actions/cache/restore@v4
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: ${{ runner.temp }}/passed-frontend.txt
          key: test-pass-frontend-${{ github.run_id }}-lookup
          restore-keys: test-pass-frontend-
      - name: Plan this shard
        id: plan
        if: ${{ env.VERIFIED != 'true' && !cancelled() && steps.select.outcome == 'success' && steps.select.outputs.selection != 'none' && (github.event_name == 'pull_request' || needs.changes.outputs.mode == 'post-merge') }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          SELECTION: ${{ steps.select.outputs.selection }}
          SHARD: ${{ matrix.shard }}/4
        run: |
          candidates=()
          if [ "$SELECTION" = affected ]; then candidates=(--candidates "$RUNNER_TEMP/selected-frontend.txt"); fi
          node tools/test-select/pass-cache-cli.mjs plan --project frontend --shard "$SHARD" \
            --passed "$RUNNER_TEMP/passed-frontend.txt" "${candidates[@]}" --graph "$RUNNER_TEMP/graph-frontend.json" \
            --run-out "$RUNNER_TEMP/planned-frontend.txt" --keys-out "$RUNNER_TEMP/keys-frontend.json" \
            --summary "$GITHUB_STEP_SUMMARY"
          # post-merge records but never skips: it runs its whole shard. Shadow
          # mode records but never skips either (decided 2026-10-14): a cached
          # skip uses the same dependency knowledge as the selector, so it
          # could hide exactly the misses the shadow week exists to find.
          if [ "${{ github.event_name }}" = pull_request ] && [ "$SELECTION" != shadow ]; then cp "$RUNNER_TEMP/planned-frontend.txt" "$RUNNER_TEMP/run-frontend.txt"; fi
      - name: Run tests
        if: ${{ env.VERIFIED != 'true' && !cancelled() && steps.select.outcome == 'success' }}
        working-directory: frontend
        env:
          SELECTION: ${{ steps.select.outputs.selection }}
          LIST: ${{ runner.temp }}/selected-frontend.txt
          REPORT: ${{ runner.temp }}/vitest-frontend.json
          FAILED: ${{ runner.temp }}/failed-frontend.txt
          REGISTRY_LIST: ${{ runner.temp }}/registry-frontend.txt
          REGISTRY_SELECTION: ${{ steps.select.outputs.registry_selection }}
          REGISTRY_OUT: ${{ runner.temp }}/registry-check-frontend.json
          SHADOW_SELECTION: ${{ steps.select.outputs.shadow_selection }}
          SHADOW_OUT: ${{ runner.temp }}/shadow-frontend.json
          PROJECT: frontend
          SHARD: ${{ matrix.shard }}/4
          RUN_LIST: ${{ runner.temp }}/run-frontend.txt
        run: bash ../tools/test-select/run-suite.sh
      - name: Record the passes
        id: record
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        continue-on-error: true
        run: |
          node tools/test-select/pass-cache-cli.mjs record --project frontend --keys "$RUNNER_TEMP/keys-frontend.json" \
            --report "$RUNNER_TEMP/vitest-frontend.json" --log "$RUNNER_TEMP/vitest-frontend.json.log" --rc "$RUNNER_TEMP/vitest-frontend.json.rc" \
            --out "$RUNNER_TEMP/proven-frontend-${{ matrix.shard }}.txt"
      - name: Upload the passes
        if: ${{ !cancelled() && steps.record.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: proven-frontend-${{ matrix.shard }}
          path: ${{ runner.temp }}/proven-frontend-${{ matrix.shard }}.txt
          retention-days: 1
          overwrite: true
      - name: Upload the selection
        if: ${{ env.VERIFIED != 'true' && always() && steps.select.outputs.selection == 'affected' }}
        uses: actions/upload-artifact@v5
        with:
          name: selection-frontend-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/selection-frontend.json
            ${{ runner.temp }}/registry-check-frontend.json
          retention-days: 30
          overwrite: true
      # Shadow mode's evidence: the miss check, and the selection it was
      # checked against (its `total` is the denominator of the "would run"
      # share) — or the selector's crash record, when it fell back to a full
      # run. Gated on the MODE, not the selection, so the crash is uploaded
      # too. tools/test-select/shadow-report.mjs aggregates these.
      - name: Upload the shadow check
        if: ${{ env.VERIFIED != 'true' && always() && needs.changes.outputs.mode == 'shadow' }}
        uses: actions/upload-artifact@v5
        with:
          name: shadow-frontend-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/shadow-frontend.json
            ${{ runner.temp }}/selection-frontend.json
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true
      - name: Upload failed files for attribution
        if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        uses: actions/upload-artifact@v5
        with:
          name: failed-frontend-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/failed-frontend.txt
            ${{ runner.temp }}/failed-frontend.txt.flaky
            ${{ runner.temp }}/failed-frontend.txt.unknown
          if-no-files-found: ignore
          overwrite: true

  remotion-tests:
    name: Remotion Tests
    needs: [prepare-packages]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful preparation
        env:
          DEPENDENCIES: ${{ toJSON(needs) }}
        run: echo "$DEPENDENCIES" | jq -e 'all(.[]; .result == "success")'
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm 11
        run: corepack enable npm && corepack prepare npm@11.12.1 --activate
      - name: Install workspace dependencies
        run: npm ci
      - name: Restore shared packages
        id: build-packages
        uses: ./.github/actions/restore-ci-build
        with:
          kind: packages
      - name: Run remotion tests
        run: npm run test
        working-directory: packages/remotion

  # The test de-dup proof harness (tools/test-dedup/) through the REAL Vitest
  # runner, coverage and CLI — the regression cases of every probe that once
  # produced a false PROVEN (PR #2302). They need node_modules, which the
  # tools self-test job (no npm ci) lacks; TEST_DEDUP_REQUIRE_VITEST makes a
  # missing install fail here instead of skipping. Runs when the Diff Gate
  # sees one of the harness's inputs change (always on push).
  test-dedup-harness:
    name: Test De-dup Harness
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.testdedup != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm 11
        run: corepack enable npm && corepack prepare npm@11.12.1 --activate
      - name: Install workspace dependencies
        run: npm ci
      - name: Equivalence harness (real Vitest runner, coverage, CLI)
        env:
          TEST_DEDUP_REQUIRE_VITEST: "1"
        run: node --test tools/__tests__/test-dedup-equivalence.test.mjs tools/__tests__/test-dedup-equivalence-vitest.test.mjs

  backend-test-shards:
    name: Backend Tests (${{ matrix.shard }}/4)
    needs: [changes, prepare-packages]
    # Four shards per suite (decided 2026-10-14, from the §5.0 capacity
    # experiment on 2-vCPU runners: backend 37 → 8.4 min, frontend 32 → 11 min
    # at 4 shards, for ~20 % more runner-minutes). The fan-in job below keeps
    # the required check's name.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.prepare-packages.result != 'success' || needs.changes.outputs.backend == 'true') }}
    # Enable only after validating the disposable pool; forks stay hosted.
    # A named same-repository pilot branch can opt in before general routing.
    runs-on: ${{ needs.changes.outputs.mode == 'verified' && 'ubuntu-slim' || github.repository == 'nodaroai/app.nodaro.ai-internal' && (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RAILWAY_ENABLED == 'true' || vars.CI_RAILWAY_PILOT_BRANCH != '' && github.head_ref == vars.CI_RAILWAY_PILOT_BRANCH) && fromJSON('["self-hosted", "linux", "x64", "nodaro-ci"]') || 'ubuntu-latest' }}
    # Hang guard (issue #801): the job wedged 48-83 min five times in two days.
    # Every one of those was the runner's apt mirror stalling inside the old
    # `apt-get install ffmpeg` step — vitest was never reached — so that step
    # is now a pinned static download (below) and the cap only has to catch a
    # genuine test hang.
    #
    # Sized to the SLOW end of the disposable pool, not the fast one. Measured
    # 2026-09-22 on nodaro-ci runners an hour apart, same suite: one instance
    # ran the job in 10m37s (vitest 9m), two others took 25m+ (vitest 21-23m)
    # with EVERY step 2-3x slower — npm ci 19s vs 70s, the ffmpeg download 8s
    # vs 18s — i.e. a slower host, not a hung test. A 25-minute cap killed
    # both healthy runs to the second (#1583), reported as "canceled" with all
    # 25k tests already green in the log. 40 clears the slow instance with
    # margin and still self-terminates a real hang inside the hour #801 was
    # about. If the pool gets faster, lower it back with the numbers.
    # Push runs get 60: the post-merge dev run is the full suite (without
    # coverage — that runs nightly), and a main push that has to run in full
    # (its tree was not verified on dev) is the same full suite.
    timeout-minutes: ${{ github.event_name == 'push' && 60 || 40 }}
    env:
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-key
      EDITION: cloud
      NODE_ENV: test
      YOUTUBE_DL_SKIP_DOWNLOAD: true
      VERIFIED: ${{ needs.changes.outputs.mode == 'verified' }}
    steps:
      - name: Already verified
        if: env.VERIFIED == 'true'
        env:
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          printf '### Backend Tests: verified\n\n%s\n' "$REASON" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Require successful preparation
        if: env.VERIFIED != 'true'
        env:
          DEPENDENCIES: ${{ toJSON(needs) }}
        run: echo "$DEPENDENCIES" | jq -e 'all(.[]; .result == "success")'
      - uses: actions/checkout@v5
        if: env.VERIFIED != 'true'
        with:
          persist-credentials: false
          # the merge commit and its first parent: Select diffs them
          fetch-depth: 2
      - uses: actions/setup-node@v5
        if: env.VERIFIED != 'true'
        with:
          node-version: 22
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: false
          cache-dependency-path: package-lock.json
      # Hosted preparation populates this cache. Disposable runners only read
      # it, avoiding cache uploads on the test job's completion path.
      - name: Restore npm downloads on Railway
        if: env.VERIFIED != 'true' && runner.environment == 'self-hosted'
        uses: actions/cache/restore@v4
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: ~/.npm
          key: node-cache-${{ runner.os }}-x64-npm-${{ hashFiles('package-lock.json') }}
      # ffmpeg for the real-ffmpeg e2e tests (assemble-narrated-video,
      # trim-edge-frames): the production-pinned static build, installed by
      # the SAME script the Dockerfile and the characterize job use — NOT apt.
      # `sudo apt-get update && apt-get install ffmpeg` on the bare runner was
      # the actual cause of issue #801's "Backend Tests hang": the apt mirror
      # stalled inside that step for 48-83 min (PRs #798/#790/#800, attempt 1)
      # and 19 min (PR #813, which then blew the 25-min cap mid-vitest), and
      # even a healthy run spent 7+ min there. The static tarball is one
      # sha256-verified GitHub-release download (seconds), and it is the
      # ffmpeg production actually ships (apt gave 6.1.1; prod is 8.1.x), so
      # these tests now exercise the binary that runs in the image.
      - name: Install the production-pinned ffmpeg (via tools/install-pinned-ffmpeg.sh)
        if: env.VERIFIED != 'true'
        run: sudo bash tools/install-pinned-ffmpeg.sh --from-dockerfile Dockerfile --arch amd64
      - name: Pin npm 11
        if: env.VERIFIED != 'true'
        run: corepack enable npm && corepack prepare npm@11.12.1 --activate
      - name: Install workspace dependencies
        if: env.VERIFIED != 'true'
        run: npm ci
      - name: Restore shared packages
        id: build-packages
        if: env.VERIFIED != 'true'
        uses: ./.github/actions/restore-ci-build
        with:
          kind: packages
      # gen-skills drift gate moved to Type Check (unfiltered) — its input is
      # frontend/src/types/nodes.ts, so gating it behind `backend=true` meant
      # a frontend-only node-field edit skipped the very check it can break.
      - name: Select tests
        id: select
        if: ${{ env.VERIFIED != 'true' && !cancelled() && steps.build-packages.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.changes.outputs.mode }}
          REASON: ${{ needs.changes.outputs.reason }}
          # The registry rule's own shadow period (tools/test-select/registry.mjs,
          # decided 2026-10-16): narrowed selection only when this is `enforce`.
          TEST_SELECT_REGISTRY_RULE: ${{ vars.TEST_SELECT_REGISTRY_RULE }}
        run: |
          if [ "$MODE" = "affected" ]; then
            node tools/test-select/cli.mjs --project backend --merge-commit \
              --list "$RUNNER_TEMP/selected-backend.txt" --json "$RUNNER_TEMP/selection-backend.json" --graph-out "$RUNNER_TEMP/graph-backend.json" --registry-list "$RUNNER_TEMP/registry-backend.txt" \
              --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"
          elif [ "$MODE" = "shadow" ]; then
            # Shadow mode must never change a result: a selector that cannot
            # run makes this a plain full run, not a red job (the last
            # selection= line written wins). The crash is still evidence
            # against a clean shadow week, so it is written where the shadow
            # check would write and uploaded the same way.
            if ! node tools/test-select/cli.mjs --project backend --merge-commit \
              --list "$RUNNER_TEMP/selected-backend.txt" --json "$RUNNER_TEMP/selection-backend.json" --graph-out "$RUNNER_TEMP/graph-backend.json" --registry-list "$RUNNER_TEMP/registry-backend.txt" \
              --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT" --shadow 2> "$RUNNER_TEMP/select-backend.err"; then
              cat "$RUNNER_TEMP/select-backend.err" >&2
              echo "selection=full" >> "$GITHUB_OUTPUT"
              printf '### Backend Tests: full\n\nshadow mode: the selector could not run — running everything\n' >> "$GITHUB_STEP_SUMMARY"
              FIRST_LINE="$(grep -m1 -E '^[A-Za-z]*Error( \[[A-Z_]+\])?: ' "$RUNNER_TEMP/select-backend.err" || grep -m1 . "$RUNNER_TEMP/select-backend.err" || true)" node -e '
                const msg = (process.env.FIRST_LINE || "no error output").trim()
                require("fs").writeFileSync(process.argv[1], JSON.stringify({ project: "backend", error: "selector crashed: " + msg, crashed: true }) + "\n")' \
                "$RUNNER_TEMP/shadow-backend.json" || true
            else
              cat "$RUNNER_TEMP/select-backend.err" >&2
            fi
          else
            # An empty or unknown mode (the Diff Gate failed) is a full run.
            case "$MODE" in post-merge) sel=post-merge ;; *) sel=full ;; esac
            echo "selection=$sel" >> "$GITHUB_OUTPUT"
            printf '### Backend Tests: %s\n\n%s\n' "$sel" "${REASON:-the Diff Gate gave no mode — running everything}" >> "$GITHUB_STEP_SUMMARY"
          fi
      # No run here measures coverage (it adds ~40% wall time and gates
      # nothing); nightly-coverage.yml does — decided 2026-10-13.
      # The pass cache (§5.6, decided 2026-10-14): a test file whose exact
      # inputs (its content, every module it loads, the files it declares it
      # reads, the environment) already passed is not run again on a PR. Dev's
      # post-merge runs record their passes too — they seed every PR — but
      # never skip anything: they are the evidence main's `verified` trusts.
      # Every step here is best-effort: without a plan the shard runs as before.
      - name: Restore the pass cache
        if: ${{ env.VERIFIED != 'true' && !cancelled() && steps.select.outcome == 'success' && github.event_name == 'pull_request' && steps.select.outputs.selection != 'shadow' }}
        uses: actions/cache/restore@v4
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: ${{ runner.temp }}/passed-backend.txt
          key: test-pass-backend-${{ github.run_id }}-lookup
          restore-keys: test-pass-backend-
      - name: Plan this shard
        id: plan
        if: ${{ env.VERIFIED != 'true' && !cancelled() && steps.select.outcome == 'success' && steps.select.outputs.selection != 'none' && (github.event_name == 'pull_request' || needs.changes.outputs.mode == 'post-merge') }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          SELECTION: ${{ steps.select.outputs.selection }}
          SHARD: ${{ matrix.shard }}/4
        run: |
          candidates=()
          if [ "$SELECTION" = affected ]; then candidates=(--candidates "$RUNNER_TEMP/selected-backend.txt"); fi
          node tools/test-select/pass-cache-cli.mjs plan --project backend --shard "$SHARD" \
            --passed "$RUNNER_TEMP/passed-backend.txt" "${candidates[@]}" --graph "$RUNNER_TEMP/graph-backend.json" \
            --run-out "$RUNNER_TEMP/planned-backend.txt" --keys-out "$RUNNER_TEMP/keys-backend.json" \
            --summary "$GITHUB_STEP_SUMMARY"
          # post-merge records but never skips: it runs its whole shard. Shadow
          # mode records but never skips either (decided 2026-10-14): a cached
          # skip uses the same dependency knowledge as the selector, so it
          # could hide exactly the misses the shadow week exists to find.
          if [ "${{ github.event_name }}" = pull_request ] && [ "$SELECTION" != shadow ]; then cp "$RUNNER_TEMP/planned-backend.txt" "$RUNNER_TEMP/run-backend.txt"; fi
      - name: Run tests
        if: ${{ env.VERIFIED != 'true' && !cancelled() && steps.select.outcome == 'success' }}
        working-directory: backend
        env:
          SELECTION: ${{ steps.select.outputs.selection }}
          LIST: ${{ runner.temp }}/selected-backend.txt
          REPORT: ${{ runner.temp }}/vitest-backend.json
          FAILED: ${{ runner.temp }}/failed-backend.txt
          REGISTRY_LIST: ${{ runner.temp }}/registry-backend.txt
          REGISTRY_SELECTION: ${{ steps.select.outputs.registry_selection }}
          REGISTRY_OUT: ${{ runner.temp }}/registry-check-backend.json
          SHADOW_SELECTION: ${{ steps.select.outputs.shadow_selection }}
          SHADOW_OUT: ${{ runner.temp }}/shadow-backend.json
          PROJECT: backend
          SHARD: ${{ matrix.shard }}/4
          RUN_LIST: ${{ runner.temp }}/run-backend.txt
        run: bash ../tools/test-select/run-suite.sh
      - name: Record the passes
        id: record
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        continue-on-error: true
        run: |
          node tools/test-select/pass-cache-cli.mjs record --project backend --keys "$RUNNER_TEMP/keys-backend.json" \
            --report "$RUNNER_TEMP/vitest-backend.json" --log "$RUNNER_TEMP/vitest-backend.json.log" --rc "$RUNNER_TEMP/vitest-backend.json.rc" \
            --out "$RUNNER_TEMP/proven-backend-${{ matrix.shard }}.txt"
      - name: Upload the passes
        if: ${{ !cancelled() && steps.record.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: proven-backend-${{ matrix.shard }}
          path: ${{ runner.temp }}/proven-backend-${{ matrix.shard }}.txt
          retention-days: 1
          overwrite: true
      - name: Upload the selection
        if: ${{ env.VERIFIED != 'true' && always() && steps.select.outputs.selection == 'affected' }}
        uses: actions/upload-artifact@v5
        with:
          name: selection-backend-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/selection-backend.json
            ${{ runner.temp }}/registry-check-backend.json
          retention-days: 30
          overwrite: true
      # Shadow mode's evidence: the miss check, and the selection it was
      # checked against (its `total` is the denominator of the "would run"
      # share) — or the selector's crash record, when it fell back to a full
      # run. Gated on the MODE, not the selection, so the crash is uploaded
      # too. tools/test-select/shadow-report.mjs aggregates these.
      - name: Upload the shadow check
        if: ${{ env.VERIFIED != 'true' && always() && needs.changes.outputs.mode == 'shadow' }}
        uses: actions/upload-artifact@v5
        with:
          name: shadow-backend-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/shadow-backend.json
            ${{ runner.temp }}/selection-backend.json
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true
      # The workspace-package suites ran ONLY locally until 2026-07-14 —
      # packages/prompts/seedance-extend.test.ts silently broke on dev twice
      # (#83's new stitch field, #116's 1→2 retune) because nothing in CI ran
      # it. Gate both suites here (inside an existing REQUIRED check) rather
      # than as new jobs, so branch protection needs no new check names.
      # `if: !cancelled() ...` so a backend-test failure doesn't mask package
      # results (and vice versa) — all three suites report per run. Anchored
      # on build-packages success: prompts tests import @nodaro/shared's dist.
      # They run on every run, affected mode included: their tests read files
      # outside packages/ (docs/nodes/**, docs/node-inventory.md).
      - name: Run @nodaro/shared test suite
        if: ${{ env.VERIFIED != 'true' && !cancelled() && steps.build-packages.outcome == 'success' && matrix.shard == 2 }}
        run: npm run test --workspace=@nodaro/shared
      - name: Run @nodaro/prompts test suite
        if: ${{ env.VERIFIED != 'true' && !cancelled() && steps.build-packages.outcome == 'success' && matrix.shard == 3 }}
        run: npm run test --workspace=@nodaro/prompts
      - name: Upload failed files for attribution
        if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        uses: actions/upload-artifact@v5
        with:
          name: failed-backend-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/failed-backend.txt
            ${{ runner.temp }}/failed-backend.txt.flaky
            ${{ runner.temp }}/failed-backend.txt.unknown
          if-no-files-found: ignore
          overwrite: true

  # Post-merge failure on dev → a comment on the PR whose merge produced the
  # commit. Every dev commit has its own full run (see concurrency), so the
  # previous commit's result says whether this merge is the likely cause.
  # The required checks "Frontend Tests" / "Backend Tests": green when every
  # shard passed, or when the Diff Gate ran and said the suite is not needed
  # (every shard is then skipped). A failed or cancelled shard, or shards
  # skipped for any other reason, fail it.
  frontend-tests:
    name: Frontend Tests
    needs: [changes, frontend-test-shards]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    steps:
      # The pass cache: this run's proven passes merged into the newest
      # recorded set, saved as a new entry the next run restores. Best-effort —
      # never decides this check (the last step does).
      - uses: actions/checkout@v5
        if: ${{ github.event_name == 'pull_request' || needs.changes.outputs.mode == 'post-merge' }}
        continue-on-error: true
        timeout-minutes: 2
        with:
          persist-credentials: false
          sparse-checkout: tools/test-select
      - uses: actions/setup-node@v5
        if: ${{ github.event_name == 'pull_request' || needs.changes.outputs.mode == 'post-merge' }}
        continue-on-error: true
        timeout-minutes: 2
        with:
          node-version: 22
      - uses: actions/download-artifact@v5
        id: proven
        if: ${{ github.event_name == 'pull_request' || needs.changes.outputs.mode == 'post-merge' }}
        continue-on-error: true
        timeout-minutes: 2
        with:
          pattern: proven-frontend-*
          merge-multiple: true
          path: ${{ runner.temp }}/proven
      - uses: actions/cache/restore@v4
        if: ${{ steps.proven.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: ${{ runner.temp }}/passed-frontend.txt
          key: test-pass-frontend-${{ github.run_id }}-lookup
          restore-keys: test-pass-frontend-
      - name: Merge the passes
        id: merge
        if: ${{ steps.proven.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          shopt -s nullglob
          proven=("$RUNNER_TEMP"/proven/proven-frontend-*.txt)
          [ "${#proven[@]}" -gt 0 ] || exit 1
          node tools/test-select/pass-cache-cli.mjs merge --previous "$RUNNER_TEMP/passed-frontend.txt" \
            --out "$RUNNER_TEMP/passed-frontend.txt" "${proven[@]}"
      - uses: actions/cache/save@v4
        if: ${{ steps.merge.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: ${{ runner.temp }}/passed-frontend.txt
          key: test-pass-frontend-${{ github.run_id }}-${{ github.run_attempt }}
      - env:
          RESULT: ${{ needs.frontend-test-shards.result }}
          GATE: ${{ needs.changes.result }}
          SUITE: ${{ needs.changes.outputs.frontend }}
        run: |
          echo "shards: $RESULT (Diff Gate: $GATE, suite needed: $SUITE)"
          if [ "$RESULT" = success ]; then exit 0; fi
          [ "$RESULT" = skipped ] && [ "$GATE" = success ] && [ "$SUITE" = false ]

  backend-tests:
    name: Backend Tests
    needs: [changes, backend-test-shards]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    steps:
      # The pass cache: this run's proven passes merged into the newest
      # recorded set, saved as a new entry the next run restores. Best-effort —
      # never decides this check (the last step does).
      - uses: actions/checkout@v5
        if: ${{ github.event_name == 'pull_request' || needs.changes.outputs.mode == 'post-merge' }}
        continue-on-error: true
        timeout-minutes: 2
        with:
          persist-credentials: false
          sparse-checkout: tools/test-select
      - uses: actions/setup-node@v5
        if: ${{ github.event_name == 'pull_request' || needs.changes.outputs.mode == 'post-merge' }}
        continue-on-error: true
        timeout-minutes: 2
        with:
          node-version: 22
      - uses: actions/download-artifact@v5
        id: proven
        if: ${{ github.event_name == 'pull_request' || needs.changes.outputs.mode == 'post-merge' }}
        continue-on-error: true
        timeout-minutes: 2
        with:
          pattern: proven-backend-*
          merge-multiple: true
          path: ${{ runner.temp }}/proven
      - uses: actions/cache/restore@v4
        if: ${{ steps.proven.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: ${{ runner.temp }}/passed-backend.txt
          key: test-pass-backend-${{ github.run_id }}-lookup
          restore-keys: test-pass-backend-
      - name: Merge the passes
        id: merge
        if: ${{ steps.proven.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          shopt -s nullglob
          proven=("$RUNNER_TEMP"/proven/proven-backend-*.txt)
          [ "${#proven[@]}" -gt 0 ] || exit 1
          node tools/test-select/pass-cache-cli.mjs merge --previous "$RUNNER_TEMP/passed-backend.txt" \
            --out "$RUNNER_TEMP/passed-backend.txt" "${proven[@]}"
      - uses: actions/cache/save@v4
        if: ${{ steps.merge.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: ${{ runner.temp }}/passed-backend.txt
          key: test-pass-backend-${{ github.run_id }}-${{ github.run_attempt }}
      - env:
          RESULT: ${{ needs.backend-test-shards.result }}
          GATE: ${{ needs.changes.result }}
          SUITE: ${{ needs.changes.outputs.backend }}
        run: |
          echo "shards: $RESULT (Diff Gate: $GATE, suite needed: $SUITE)"
          if [ "$RESULT" = success ]; then exit 0; fi
          [ "$RESULT" = skipped ] && [ "$GATE" = success ] && [ "$SUITE" = false ]

  attribute-dev-failure:
    name: Attribute Dev Failure
    needs: [frontend-tests, backend-tests]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && (needs.frontend-tests.result == 'failure' || needs.backend-tests.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: tools/test-select
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: failed-*
          path: ${{ runner.temp }}/failed
      - name: Comment on the PR that produced this commit
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          FAILED_DIR: ${{ runner.temp }}/failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # failed-<p>.txt: failed again when re-run alone (or not re-run);
          # failed-<p>.txt.flaky: passed alone — labelled, never forgiven;
          # failed-<p>.txt.unknown: the re-run crashed without a report.
          # One artifact per shard: failed-<p>-<shard>/failed-<p>.txt…
          read_list() {
            for f in "$FAILED_DIR"/failed-"$1"-*/failed-"$1".txt"${2:-}"; do
              if [ -f "$f" ]; then cat "$f"; fi
            done
          }
          FAILED_FRONTEND="$(read_list frontend)"
          FAILED_BACKEND="$(read_list backend)"
          FLAKY_FRONTEND="$(read_list frontend .flaky)"
          FLAKY_BACKEND="$(read_list backend .flaky)"
          UNKNOWN_FRONTEND="$(read_list frontend .unknown)"
          UNKNOWN_BACKEND="$(read_list backend .unknown)"
          PREVIOUS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$BEFORE&event=push&branch=dev&per_page=1" --jq '.workflow_runs[0].conclusion // "none"' || echo none)"
          export FAILED_FRONTEND FAILED_BACKEND FLAKY_FRONTEND FLAKY_BACKEND UNKNOWN_FRONTEND UNKNOWN_BACKEND PREVIOUS
          # commits/{sha}/pulls also lists OPEN PRs that contain the commit;
          # only the PR whose merge commit IS this commit produced it.
          PR="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq "[.[] | select(.merge_commit_sha == \"$GITHUB_SHA\")][0].number // empty" || true)"
          node --input-type=module -e '
            import { buildAttributionComment } from "./tools/test-select/attribution.mjs"
            const split = (s) => (s ?? "").split("\n").filter(Boolean)
            process.stdout.write(buildAttributionComment({
              sha: process.env.GITHUB_SHA, before: process.env.BEFORE, runUrl: process.env.RUN_URL,
              failed: { frontend: split(process.env.FAILED_FRONTEND), backend: split(process.env.FAILED_BACKEND) },
              flaky: { frontend: split(process.env.FLAKY_FRONTEND), backend: split(process.env.FLAKY_BACKEND) },
              unknown: { frontend: split(process.env.UNKNOWN_FRONTEND), backend: split(process.env.UNKNOWN_BACKEND) },
              previousConclusion: process.env.PREVIOUS,
            }))' > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR" ]; then gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"; fi

  # The ffmpeg memory ledger's real Lua scripts (and, in the same job, the
  # download-slot ledger's: download-slot-ledger.redis.test.ts, and the admin
  # presence store's: presence-redis.redis.test.ts). Every other
  # ledger test runs on a JS twin of them (fake-ledger-redis.ts), so a mistake in the scripts — a
  # string compared with a number, a wrong key — would ship green. This job runs
  # the same contract against a real Redis and FAILS (never skips) if it cannot
  # reach one. A job of its own, not a service on Backend Tests: that job may run
  # on a self-hosted runner, where a service container needs Docker.
  ffmpeg-ledger-redis:
    name: FFmpeg Ledger (real Redis)
    needs: [changes, prepare-packages]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.prepare-packages.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-key
      EDITION: cloud
      NODE_ENV: test
      YOUTUBE_DL_SKIP_DOWNLOAD: true
      FFMPEG_LEDGER_TEST_REDIS_URL: redis://localhost:6379
      FFMPEG_LEDGER_REQUIRE_REDIS: "1"
    steps:
      - name: Require successful preparation
        env:
          DEPENDENCIES: ${{ toJSON(needs) }}
        run: echo "$DEPENDENCIES" | jq -e 'all(.[]; .result == "success")'
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm 11
        run: corepack enable npm && corepack prepare npm@11.12.1 --activate
      - name: Install workspace dependencies
        run: npm ci
      - name: Restore shared packages
        uses: ./.github/actions/restore-ci-build
        with:
          kind: packages
      - name: Run the ledger suites against the real Redis
        working-directory: backend
        run: npx vitest run src/providers/video/__tests__/ffmpeg-memory-ledger.redis.test.ts src/lib/__tests__/download-slot-ledger.redis.test.ts src/ee/lib/__tests__/presence-redis.redis.test.ts

  typecheck:
    name: Type Check
    needs: [changes, prepare-packages]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      YOUTUBE_DL_SKIP_DOWNLOAD: true
      # A per-process ceiling for the Node-based checks below (gen-skills, the
      # surface report, vitest). Type checking itself no longer runs in Node
      # (TS 7 is a Go binary); TS 5.9's frontend check needed this after four
      # exit-134 OOM crashes on 2026-08-12 (#594/#598/#599).
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Require successful preparation
        env:
          DEPENDENCIES: ${{ toJSON(needs) }}
        run: echo "$DEPENDENCIES" | jq -e 'all(.[]; .result == "success")'
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm 11
        run: corepack enable npm && corepack prepare npm@11.12.1 --activate
      - name: Install workspace dependencies
        run: npm ci
      - name: Restore shared packages
        id: build-packages
        uses: ./.github/actions/restore-ci-build
        with:
          kind: packages
      # The five checks below run CONCURRENTLY in one step (decided
      # 2026-10-13: they used to run one after another, ~7 min): each is a
      # background process with its own log and exit status, waited on by PID,
      # and printed afterwards in its own log group. A failure of any of them
      # fails the job, except the surface report, which never does.
      #
      # 1. typecheck — `npm run typecheck -- --serial` (tools/typecheck-all.mjs):
      #    `tsc --noEmit` on TypeScript 7 (native) for frontend, backend,
      #    packages/cli and packages/shared. One project at a time HERE: each
      #    TS 7 run already checks on every core, and frontend + backend at
      #    once peak above 7.7 GB (SIGKILLed in a 4-CPU / 7.7 GB container,
      #    measured 2026-10-13); one at a time with GOMEMLIMIT=4GiB (a soft
      #    cap: the Go GC works harder near it, it never fails a run) peaks
      #    ~4.7 GB in ~31 s on 4 cores, leaving the other three checks (~1.4-
      #    1.8 GB each) room on this runner (private repo: 2 vCPU / 8 GB).
      #    The whole step passed in a 2-CPU / 7 GB container, peak 6.2 GB.
      #    The parity tests get the CPU first: the checker runs at
      #    `nice -n 19`, gen-skills and the surface report at `nice -n 10`,
      #    and the parity run's per-test timeout is 30 s here (5 s default;
      #    several tests scan the whole tree, ~1.7 s each on a fast laptop,
      #    and two timed out next to TS 7 in a container).
      #    Locally `npm run typecheck` runs all four projects at once.
      #    packages/shared's tsconfig includes its tests, which gives the
      #    catalog-projection @ts-expect-error guard real teeth (TS2578 when a
      #    `tags`/`policy` field reaches ProjectedCatalog). Emitting builds
      #    (Build Backend Once, the Dockerfile) stay on TypeScript 5.9.
      #
      # 2-5 are cross-tree gates. They live HERE, not in Backend Tests, because
      # their inputs are frontend files while their code sits under backend/.
      # The Diff Gate classifies by file LOCATION, so a frontend-only PR skips
      # Backend Tests — precisely when these checks are most likely to catch
      # drift. That already bit us: #292 (frontend-only) added two
      # /v1/generate-video-pro paths, route-path-parity never ran, and the
      # failure surfaced on #295, an unrelated backend PR. This job has no path
      # filter, so they always run. Hosted inside an existing REQUIRED check
      # rather than a new job so branch protection needs no new check names.
      #
      # 2. gen-skills — the skill drift gate (`gen:skills:check`). Moved from
      #    Backend Tests: backend/skills/ is GENERATED FROM
      #    frontend/src/types/nodes.ts, so the one PR shape that can break it
      #    (frontend-only node-field edits) was the one shape that skipped it.
      # 3. parity — the cross-tree parity tests. DISCOVERED, never hand-listed:
      #    any backend test that references a frontend path joins this gate
      #    automatically, so a new cross-tree test cannot quietly land back
      #    inside the Diff Gate's blind spot.
      # 4. surfaces — the surface completeness report (`check:surfaces --all`):
      #    for every feature, which surfaces reach it (REST route, OpenAPI,
      #    SDK, CLI, MCP tools, and the docs for each). Here because docs-only
      #    PRs, the ones that drop doc entries, skip Backend Tests. A report
      #    for now: a failure, a crash or its 5-minute timeout is a warning,
      #    never a job failure. It becomes `--strict` once the first-run gaps
      #    are closed or exempted.
      # 5. gen-units — the node-unit drift gate (`npm run gen:units -- --check`,
      #    tools/units/README.md, decided 2026-10-16): every unit manifest
      #    (frontend/src/nodes/<type>/unit.json) is valid and every generated
      #    projection, aggregate and spliced region is up to date. A cross-tree
      #    gate like gen-skills: a frontend-only node PR writes backend
      #    aggregates. Under 2 s; it reads none of gen-skills' outputs, so the
      #    two run side by side.
      - name: Type check (TS 7) + skill drift gate + cross-tree parity + surface report + unit drift gate, in parallel
        if: ${{ !cancelled() && steps.build-packages.outcome == 'success' }}
        env:
          SUPABASE_URL: https://stub.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: stub-service-role-key
          INTERNAL_ORCHESTRATOR_SECRET: stub-stub-stub-stub-stub-stub-stub-stub-stub
        run: |
          logs="$RUNNER_TEMP/type-check-job"
          mkdir -p "$logs"
          declare -A pid

          cross_tree_parity() {
            cd backend
            files=()
            while IFS= read -r f; do files+=("$f"); done < <(
              grep -rl -e 'frontend/' -e 'frontend"' -e "frontend'" -e 'frontend`' src --include='*.test.ts' | sort
            )
            if [ ${#files[@]} -eq 0 ]; then
              echo "::error::Cross-tree test discovery matched 0 files. The detector or the tree layout changed — fix the pattern, do not delete this gate."
              return 1
            fi
            echo "Cross-tree tests (${#files[@]} files):"
            printf '  %s\n' "${files[@]}"
            npx vitest run --testTimeout=30000 "${files[@]}"
          }

          start() {
            local name=$1
            shift
            ( "$@" ) > "$logs/$name.log" 2>&1 &
            pid[$name]=$!
          }
          start typecheck nice -n 19 env GOMEMLIMIT=4GiB npm run typecheck -- --serial
          start gen-skills nice -n 10 npm -w backend run gen:skills:check
          start parity cross_tree_parity
          start surfaces nice -n 10 timeout 300 npm -w backend run check:surfaces -- --all
          start gen-units nice -n 10 npm run gen:units -- --check

          failed=()
          for name in typecheck gen-skills parity surfaces gen-units; do
            status=0
            wait "${pid[$name]}" || status=$?
            echo "::group::$name (exit $status)"
            cat "$logs/$name.log"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              if [ "$name" = surfaces ]; then
                echo "::warning::Surface completeness report failed (exit $status; 124 = 5-minute timeout). Non-failing by design."
              else
                echo "::error::$name failed (exit $status) — expand its log group above."
                failed+=("$name")
              fi
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed: ${failed[*]}"
            exit 1
          fi

  tenant-scope-lint:
    name: Tenant Scope Lint
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check tenant-scoped queries
        run: node backend/scripts/check-tenant-scope.mjs
      - name: Check admin-client imports
        run: node backend/scripts/check-admin-client-import.mjs

  migration-behavior:
    name: Migration Behavior (real Postgres)
    runs-on: ubuntu-latest
    # The organizations migrations put the tenancy rules INTO the database —
    # RLS policies, SECURITY DEFINER helpers, the invitation and join RPCs.
    # None of that is provable from the SQL text, and none of it is exercised
    # by a unit test, so every PR applies the whole chain to a real Supabase
    # Postgres and runs the behavioral assertions against it.
    services:
      postgres:
        image: supabase/postgres:15.8.1.085
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the migration runner's dependency
        run: npm install --no-save --no-audit --no-fund pg@8
      - name: Apply every migration
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          MIGRATIONS_WAIT_SECONDS: "60"
        run: node backend/scripts/run-migrations.mjs
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Verify retained image reservation concurrency
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: node backend/scripts/verify-retained-images-concurrency.mjs
      - name: Verify compatible workflow write concurrency
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: node backend/scripts/verify-compatible-writes-concurrency.mjs
      - name: Verify retained image copy proof concurrency
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: node backend/scripts/verify-retained-image-copies-concurrency.mjs
      - name: Verify yearly-plan monthly credit grant concurrency
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: node backend/scripts/verify-yearly-monthly-credits-concurrency.mjs
      - name: Allow the disposable database to exercise Auth deletion
        # Supabase's postgres login is not a superuser and cannot SET ROLE to
        # the Auth service by default. This grant is confined to the CI service
        # container; application migrations never grant this membership.
        run: >-
          docker exec -e PGPASSWORD=postgres "${{ job.services.postgres.id }}"
          psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1
          -c 'GRANT supabase_auth_admin TO postgres'
      - name: Run every behavioral proof
        env:
          PGPASSWORD: postgres
        run: |
          shopt -s nullglob
          files=(supabase/tests/*.behavior.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no behavioral proofs found — the glob or the directory moved"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "== $f"
            # The proof rolls itself back, so a failure is reported in the
            # output rather than by the exit code alone. Both are checked, and
            # the final NOTICE must be present: a file that stopped early
            # without erroring would otherwise pass silently.
            out=$(psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f "$f" 2>&1) || {
              echo "$out"
              echo "psql failed on $f"
              exit 1
            }
            if echo "$out" | grep -qE "ERROR|ASSERT FAIL"; then
              echo "$out"
              exit 1
            fi
            if ! echo "$out" | grep -q "ALL BEHAVIOR ASSERTIONS PASSED"; then
              echo "$out"
              echo "$f did not reach its final assertion"
              exit 1
            fi
            echo "   ok ($(echo "$out" | grep -c "NOTICE:  ok") assertions)"
          done
      - name: Re-apply the newest migration (idempotency)
        env:
          PGPASSWORD: postgres
        run: |
          shopt -s nullglob
          # Every migration is NNN_-prefixed and zero-padded, so the shell
          # glob is already in migration order; the last one is the newest.
          migrations=(supabase/migrations/[0-9][0-9][0-9]_*.sql)
          if [ ${#migrations[@]} -eq 0 ]; then
            echo "no migrations found — the glob or the naming convention moved"
            exit 1
          fi
          latest="${migrations[-1]}"
          echo "re-applying $latest"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f "$latest"
      # After the idempotency re-apply on purpose: the invariant must hold on
      # the state a re-run leaves behind, not only on a pristine first apply.
      - name: Concurrency proof — workspace budget under 50 simultaneous reserves
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: node backend/scripts/orgs-billing-concurrency.mjs

  i18n-completeness:
    name: i18n Locale Completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm 11
        run: corepack enable npm && corepack prepare npm@11.12.1 --activate
      - name: Install workspace dependencies
        run: npm ci
      # The full i18n catalog×locale completeness matrix test lives in
      # @nodaro/shared and was previously never run in CI (only the
      # seasons-scoped .mjs ran), so a missing locale sidecar would silently
      # fall back to English in prod. NOTE: the rest of the @nodaro/shared
      # suite has pre-existing stale failures (model/LLM registry drifted while
      # the suite went un-run in CI) — tracked separately; once those are green,
      # broaden this to `npm run test --workspace=@nodaro/shared`.
      - name: i18n locale completeness (full catalog × locale matrix)
        run: npm run test --workspace=@nodaro/shared -- src/__tests__/i18n-locale-completeness.test.ts

  check-locale-completeness:
    name: Check Locale Completeness
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check locale sidecar completeness
        run: node scripts/check-locale-completeness.mjs

  chrome-i18n-coverage:
    name: Chrome i18n Coverage Report
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Chrome i18n coverage report (non-failing)
        run: node scripts/check-chrome-i18n-coverage.mjs

  check-no-internal-specs:
    name: No Internal Specs In Repo
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Ensure internal planning docs are not committed
        run: |
          # Internal design/planning docs live in the private planning
          # repo, not here. A curated public subset is in docs/design/. This
          # guard keeps them from being re-added to the public repo.
          offenders="$(git ls-files 'specs/' 'docs/superpowers/')"
          if [ -n "$offenders" ]; then
            echo "::error::Internal planning docs must not be committed to the public repo. Move them to the private planning repo; curated public design notes belong in docs/design/."
            echo "$offenders"
            exit 1
          fi
          echo "OK: no specs/ or docs/superpowers/ tracked files."

  check-ee-imports:
    name: Check EE Imports
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check core does not import from ee/
        run: node tools/check-ee-imports.mjs
      - name: Check for private-extraction symbol leaks
        # The symbol list is a repo secret, not a tracked file — a cleartext
        # deny-list of proprietary names IS the map of what was extracted.
        # Absent (forks / public mirror CI) the check skips loudly; the mirror
        # publish path hard-requires it.
        env:
          PRIVATE_LEAK_SYMBOLS: ${{ secrets.PRIVATE_LEAK_SYMBOLS }}
        run: node tools/check-private-leaks.mjs
      - name: Check published package manifests declare real @nodaro/* ranges
        run: node tools/check-published-manifests.mjs
      - name: Install the image's Caddy (for the Caddyfile tests)
        # The Caddyfile tests run the real config and skip without a binary —
        # one guards that no file URL ever answers with the SPA's HTML. The
        # version and checksum are read from the Dockerfile, so CI tests the
        # Caddy production runs.
        run: |
          version=$(sed -n 's/^ARG CADDY_VERSION=//p' Dockerfile)
          sha512=$(sed -n 's/^ARG CADDY_SHA512_AMD64=//p' Dockerfile)
          if [ -z "$version" ] || [ -z "$sha512" ]; then
            echo "::error::CADDY_VERSION / CADDY_SHA512_AMD64 not found in the Dockerfile"
            exit 1
          fi
          dir="$RUNNER_TEMP/caddy"
          mkdir -p "$dir"
          curl -fsSL --retry 3 "https://github.com/caddyserver/caddy/releases/download/v${version}/caddy_${version}_linux_amd64.tar.gz" -o "$dir/caddy.tar.gz"
          echo "${sha512}  $dir/caddy.tar.gz" | sha512sum -c -
          tar -xzf "$dir/caddy.tar.gz" -C "$dir" caddy
          "$dir/caddy" version
          echo "$dir" >> "$GITHUB_PATH"
      - name: Tool self-tests (tools/__tests__)
        run: node --test tools/__tests__/*.test.mjs
      - name: Check no provider key is frozen at construction/import (keys are live)
        run: node tools/check-provider-key-captures.mjs

  check-surface-funnel:
    name: Check Surface Funnel
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # B1: a new hardcoded brand product-name literal in a chrome component must
      # go through surfaceBrandName() (or be allowlisted with a reason) so a
      # white-label surface profile can rename it. Keeps the 101st site honest.
      - name: Check brand literals go through the surface funnel
        run: node tools/check-surface-funnel.mjs

  check-pricing-leaks:
    # packages/shared, packages/prompts, packages/client, and packages/cli are
    # published npm artifacts (Apache-2.0 / FSL) — every release is an
    # IRREVOCABLE grant (npm tarballs can't be un-published). This guards
    # against provider-$ rate figures and platform-margin/markup derivation
    # content leaking into a future release. See the 2026-07-06 public-flip
    # IP audit (S5).
    name: Check Pricing Leaks
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check packages/*/src, migrations and docs/ for provider-$ / margin-markup leaks
        run: node tools/check-pricing-leaks.mjs

  check-public-surface:
    # The BROAD net: every never-public category over every tracked file, per
    # line and de-wrapped. The other leak checks are scoped (packages/*/src, a
    # symbol list, JSON shape) — four consecutive release-artifact audits found
    # content those scopes never read, mostly in backend/src and frontend/src.
    # Second half: the same categories over the COMMITS this PR would merge —
    # feature branches land in dev with a regular merge and the nightly mirror
    # pushes full history, so a line one commit adds and a later commit scrubs
    # is public forever via `git log -p` with the tree gate green.
    name: Check Public Surface
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The history half needs the commits, not just the merge tree.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check every tracked file for never-public content
        run: node tools/check-public-surface.mjs
      - name: Check every commit this PR adds for never-public content
        env:
          BASE: ${{ github.base_ref }}
        # Step-level skip, not a job `if:` — a skipped JOB breaks every
        # `needs:` chain that lists this one. On a push to main there is no PR
        # base to diff against; the tree half above still ran.
        run: |
          if [ -z "$BASE" ]; then
            echo "(no PR base ref — the history half runs on pull_request events)"
            exit 0
          fi
          # fetch-depth: 0 already brought origin/$BASE down, and the checkout
          # keeps no credentials — a re-fetch here would fail for lack of a
          # token, not for a finding. Verify the ref instead, so a shallow
          # regression fails visibly rather than scanning a bogus range.
          git rev-parse --verify --quiet "origin/$BASE^{commit}" > /dev/null
          node tools/check-history-surface.mjs "origin/$BASE..HEAD"

  check-billing-dumps:
    # Provider-billing extracts (backend/scripts/*.mts output: per-task provider
    # charges, per-model volume, our provider unit rate) must never be tracked —
    # they ship inside every public release tarball. One sat committed from
    # 2026-07-30 until the v1.29.6 artifact audit. Detection is by JSON shape,
    # so a rename or a new script still trips it.
    name: Check Billing Dumps
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check for tracked provider-billing extracts
        run: node tools/check-billing-dumps.mjs

  build-backend:
    name: Build Backend Once
    needs: [prepare-packages]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful preparation
        env:
          DEPENDENCIES: ${{ toJSON(needs) }}
        run: echo "$DEPENDENCIES" | jq -e 'all(.[]; .result == "success")'
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm 11
        run: corepack enable npm && corepack prepare npm@11.12.1 --activate
      - name: Install workspace dependencies
        run: npm ci
      - name: Restore shared packages
        uses: ./.github/actions/restore-ci-build
        with:
          kind: packages
      - name: Build backend (mirrors the Dockerfile — tsc + runtime asset copy)
        # The SAME heap the Dockerfile gives this step (4 GB), so a tree that
        # outgrows it fails here, not in a deploy: at Node's default ceiling the
        # build crashed with exit 134 (heap out of memory) with no type error
        # (2026-10-03; ~2.7 GB measured).
        run: npx tsc -p tsconfig.build.json && node scripts/copy-build-assets.mjs
        working-directory: backend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Package verified build outputs
        run: node tools/ci-build-artifact.mjs pack backend "$RUNNER_TEMP/ci-build-backend"
      - uses: actions/upload-artifact@v5
        with:
          name: ci-build-backend
          path: ${{ runner.temp }}/ci-build-backend/
          retention-days: 7
          overwrite: true
          compression-level: 0
          if-no-files-found: error

  backend-boot-smoke:
    # Catches startup crashes that vitest masks (e.g. ERR_MODULE_NOT_FOUND from
    # extensionless ESM imports). Compiles backend with tsconfig.build.json and
    # actually starts `node dist/server.js` against stub env vars, checking that
    # /health responds within 45s. If the process exits early or never binds,
    # the job fails — surfacing the exact class of bug that took down prod on
    # 2026-05-21 (Collect node strategies shipped with extensionless imports).
    name: Backend Boot Smoke Test (${{ matrix.edition }})
    runs-on: ubuntu-latest
    # Only the compiled backend is an input — Type Check is not, so the boot
    # starts as soon as Build Backend Once is done (merging still needs Type
    # Check: it is a required check and `migrate` lists it).
    needs: [build-backend]
    if: ${{ !cancelled() }}
    # Boot under BOTH cloud and community so a fresh self-host clone (the public
    # entry point) is covered — community gates off Stripe/admin via
    # hasCredits()/hasAdmin(), a different startup path than cloud.
    strategy:
      fail-fast: false
      matrix:
        edition: [cloud, community]
    env:
      # Backend env-schema lives in `backend/src/lib/config.ts`. Keep these
      # names in sync — Zod will reject the boot otherwise. SUPABASE_ANON_KEY
      # is NOT in the schema, so we don't set it.
      SUPABASE_URL: https://stub.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: stub-service-role-key
      INTERNAL_ORCHESTRATOR_SECRET: stub-stub-stub-stub-stub-stub-stub-stub-stub
      KIE_API_KEY: stub
      ANTHROPIC_API_KEY: stub
      R2_ACCOUNT_ID: stub
      R2_ACCESS_KEY_ID: stub
      R2_SECRET_ACCESS_KEY: stub
      R2_BUCKET_NAME: stub
      R2_PUBLIC_URL: https://stub.example.com
      EDITION: ${{ matrix.edition }}
      # Public CI is registry-token-free by design (fork PRs), so the private
      # @nodaroai/cloud-plugins package is never installed here — boot cloud in
      # the documented optional mode (warn + continue). Cloud plugin fail-fast
      # is verified in Railway builds + the private repo's pairing CI. The
      # community leg is unaffected (hasCredits() short-circuits the loader).
      PRIVATE_MODULES: optional
      PORT: 9000
    steps:
      - name: Require successful preparation
        env:
          DEPENDENCIES: ${{ toJSON(needs) }}
        run: echo "$DEPENDENCIES" | jq -e 'all(.[]; .result == "success")'
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm 11
        run: corepack enable npm && corepack prepare npm@11.12.1 --activate
      - name: Install workspace dependencies
        run: npm ci
      - name: Restore shared packages
        id: build-packages
        uses: ./.github/actions/restore-ci-build
        with:
          kind: packages
      - name: Restore compiled backend
        uses: ./.github/actions/restore-ci-build
        with:
          kind: backend
      - name: Boot backend and probe /health
        # NODE_ENV=production only on the actual boot — mirrors prod runtime
        # without breaking the upstream `npm ci` (which prunes devDependencies
        # if NODE_ENV=production is set at job level, leaving tsup missing).
        env:
          NODE_ENV: production
        run: |
          set -e
          # The use-case routes the boot probes (each use-case node adds its run and continue).
          UC_PATHS="/v1/tighten-episode /v1/tighten-episode/continue /v1/episode-chapters /v1/episode-chapters/continue"
          cd backend
          node dist/server.js > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          echo "Started backend pid=$BACKEND_PID"
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:9000/health > /dev/null 2>&1; then
              echo "Backend booted successfully after ${i}s"
              # Core routes on every edition: each use-case node's run and
              # continue ($UC_PATHS). Asked on the internal lane (the
              # orchestrator secret) so the auth hook lets the request through
              # to routing: a registered route answers its body validation
              # (400), a missing one 404. No userId, so the cloud credit guard
              # has no profile to read from the stub database and the handler's
              # validation answers.
              for UC_PATH in $UC_PATHS; do
                UC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://127.0.0.1:9000$UC_PATH" \
                  -H 'content-type: application/json' \
                  -H "x-internal-orchestrator-secret: $INTERNAL_ORCHESTRATOR_SECRET" \
                  -d '{}')
                echo "$UC_PATH probe: $UC_STATUS (edition: $EDITION)"
                if [ "$UC_STATUS" != "400" ]; then
                  if [ "$UC_STATUS" = "404" ]; then
                    echo "FAIL: $UC_PATH is not registered on the $EDITION edition (a core route: every edition)"
                  else
                    echo "FAIL: $UC_PATH answered $UC_STATUS, expected its validation answer (400) on the internal lane"
                  fi
                  kill $BACKEND_PID 2>/dev/null || true
                  exit 1
                fi
              done
              # Edition-gate runtime assertion: the Stripe webhook route is in
              # the auth-hook PUBLIC whitelist, so its status is a clean
              # registered-vs-absent signal (authed ee routes 401 before
              # routing in both editions and can't discriminate).
              #   community -> ee billing routes must NOT be registered (404)
              #   cloud     -> must be registered (anything but 404)
              WEBHOOK_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:9000/v1/billing/stripe-webhook)
              echo "stripe-webhook probe: $WEBHOOK_STATUS (edition: $EDITION)"
              if [ "$EDITION" = "community" ] && [ "$WEBHOOK_STATUS" != "404" ]; then
                echo "FAIL: community edition registered an ee billing route (expected 404, got $WEBHOOK_STATUS)"
                kill $BACKEND_PID 2>/dev/null || true
                exit 1
              fi
              if [ "$EDITION" = "cloud" ] && [ "$WEBHOOK_STATUS" = "404" ]; then
                echo "FAIL: cloud edition did NOT register the ee billing route (got 404)"
                kill $BACKEND_PID 2>/dev/null || true
                exit 1
              fi
              kill $BACKEND_PID 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 $BACKEND_PID 2>/dev/null; then
              echo "Backend process exited prematurely (startup crash)."
              echo "---- backend log ----"
              cat /tmp/backend.log
              echo "---------------------"
              exit 1
            fi
            sleep 1
          done
          echo "Backend did not respond to /health within 45s -- listener never bound."
          echo "---- backend log ----"
          cat /tmp/backend.log
          echo "---------------------"
          kill $BACKEND_PID 2>/dev/null || true
          exit 1
      - name: Boot the plugin daemon host and probe its door
        # dist/plugin-daemons.js is its own entry point (its own service, or
        # start.sh with PLUGIN_DAEMONS_IN_CONTAINER=true), so the server boot
        # above proves nothing about it. community -> exits 0 on its own.
        # cloud (no private package here, PRIVATE_MODULES=optional) -> binds,
        # answers /health with zero daemons instead of crash-looping, refuses
        # every other route without the internal secret, and exits 0 on SIGTERM.
        env:
          NODE_ENV: production
          PLUGIN_DAEMONS_PORT: 9100
        run: |
          cd backend
          node dist/plugin-daemons.js > /tmp/plugin-daemons.log 2>&1 &
          PID=$!
          fail() { echo "FAIL: $1"; echo "---- daemon host log ----"; cat /tmp/plugin-daemons.log; kill $PID 2>/dev/null || true; exit 1; }
          if [ "$EDITION" = "community" ]; then
            for i in $(seq 1 30); do
              if ! kill -0 $PID 2>/dev/null; then
                if wait $PID; then echo "Daemon host exited cleanly on community after ${i}s"; exit 0; fi
                fail "daemon host exited non-zero on community"
              fi
              sleep 1
            done
            fail "daemon host did not exit on community within 30s"
          fi
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:9100/health > /dev/null 2>&1; then
              echo "Daemon host answered /health after ${i}s"
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9100/any/route)
              [ "$STATUS" = "401" ] || fail "a route without the internal secret answered $STATUS (expected 401)"
              kill -TERM $PID
              if wait $PID; then echo "Daemon host drained and exited 0 on SIGTERM"; exit 0; fi
              fail "daemon host did not exit 0 on SIGTERM"
            fi
            kill -0 $PID 2>/dev/null || fail "daemon host exited prematurely (startup crash)"
            sleep 1
          done
          fail "daemon host did not answer /health within 45s"

  migrate:
    name: Push Database Migrations
    runs-on: ubuntu-latest
    if: github.repository == 'nodaroai/app.nodaro.ai-internal' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    # migration-behavior is in this list on purpose and must stay: it is the
    # only job that applies the migration chain to a real Postgres and asserts
    # what the tenancy rules DO (RLS, SECURITY DEFINER helpers, the RPCs).
    # Without it here, a migration whose proof failed still reached production
    # — the job ran, went red, and nothing downstream cared. Found while
    # planning the content-scoping migrations, 2026-08-23.
    needs: [prepare-packages, build-backend, frontend-tests, backend-tests, ffmpeg-ledger-redis, typecheck, tenant-scope-lint, check-locale-completeness, check-ee-imports, check-pricing-leaks, check-billing-dumps, check-public-surface, check-surface-funnel, i18n-completeness, backend-boot-smoke, migration-behavior]
    env:
      # Disable CLI telemetry. The CLI flushes anonymous PostHog analytics on
      # exit; on a runner that flush can time out and surface as a spurious
      # exit 1 *after* the command already succeeded ("Finished supabase link."
      # → "Timeout while shutting down PostHog. Some events may not have been
      # sent." → exit 1). A failed link step silently skips `db push`, so prod
      # never gets the migrations. No telemetry client = nothing to flush =
      # no timeout. Gated by canSend() in supabase/cli telemetry/service.go.
      # Set at job level so the push step is covered too.
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          # Pin the CLI — `latest` is non-deterministic across runs (a build
          # that propagates the telemetry-shutdown error to the exit code can
          # break prod migrations on one merge while the next merge passes).
          version: 2.105.0
      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  changeset-guard:
    name: Changeset Guard
    # Every PR that changes a published package must carry a changeset, so the
    # release train (release.yml) learns about it. Escape hatch for changes
    # that genuinely need no release note: `npx changeset --empty`.
    # Skipped for the release train's own PRs (version PR consumes changesets;
    # dev→main promos carry already-consumed ones). A promote is sometimes cut
    # from a `promote/*` branch pinned to a commit rather than from `dev` — when
    # `dev` has moved on to work that is still soaking — and it carries the same
    # already-consumed changesets, so it is skipped on the same grounds.
    if: github.event_name == 'pull_request' && github.head_ref != 'dev' && !startsWith(github.head_ref, 'changeset-release/') && !startsWith(github.head_ref, 'promote/')
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a changeset when published packages change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pkg_changes=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" -- \
            packages/shared packages/client packages/cli | grep -v CHANGELOG.md || true)
          if [ -z "$pkg_changes" ]; then
            echo "No published-package changes — guard not applicable."
            exit 0
          fi
          added_changesets=$(git diff --name-only --diff-filter=A "$BASE_SHA"..."$HEAD_SHA" -- \
            '.changeset/*.md' | grep -v README.md || true)
          if [ -n "$added_changesets" ]; then
            echo "Package changes covered by changeset(s):"
            echo "$added_changesets"
            exit 0
          fi
          echo "::error::This PR changes published packages but adds no changeset."
          echo "Changed package files:"
          echo "$pkg_changes"
          echo ""
          echo "Add one with:  npx changeset        (pick bump level + write a note)"
          echo "Or, if this change needs no release:  npx changeset --empty"
          exit 1

  # ffmpeg OUTPUT characterization — renders synthetic lavfi fixtures through
  # every ffmpeg-backed operation (backend/src/providers/video) and compares
  # measured properties of the DECODED output against committed golden values
  # (backend/src/providers/video/__characterization__/golden/). This is the
  # net the arg-string tests cannot be: a 6 dB rendered-output change (the
  # afir ×2→×1 incident) is invisible to them and CI stayed green through it.
  #
  # It runs inside node:22-slim with the SAME sha256-pinned static ffmpeg
  # tarball as the production image (Dockerfile ARG FFMPEG_TARBALL_URL_AMD64 /
  # _SHA256_AMD64, parsed below so the pin has one source of truth) — NEVER on
  # the bare runner, whose preinstalled ffmpeg is a different version and
  # would bless/verify the wrong numbers. A download or checksum failure fails
  # this job loudly — the same deliberate failure mode as the production
  # docker build. Bump the pins, re-bless the golden inside the new image
  # (backend/scripts/characterize-in-image.sh bless), review the report diff,
  # and ship all of it in one PR.
  characterize:
    name: FFmpeg Output Characterization
    needs: [prepare-packages]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container: node:22-slim
    env:
      YOUTUBE_DL_SKIP_DOWNLOAD: true
      # node:22-slim has no python; youtube-dl-exec's preinstall probes for it
      # (bare-runner jobs never see this — GitHub runners ship python).
      YOUTUBE_DL_SKIP_PYTHON_CHECK: 1
    steps:
      - name: Require successful preparation
        env:
          PREPARE_RESULT: ${{ needs.prepare-packages.result }}
        run: test "$PREPARE_RESULT" = success
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install the production-pinned ffmpeg + fonts (via tools/install-pinned-ffmpeg.sh)
        run: |
          # Same binary as production, one source of truth: the Dockerfile's
          # static-tarball pin, parsed and installed by the SAME script the
          # Dockerfile and characterize-in-image.sh use. The script hard-errors
          # if the pin can't be resolved — installing anything else would
          # bless/verify goldens against the wrong binary.
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            curl ca-certificates xz-utils fontconfig fonts-dejavu-core fonts-liberation
          bash tools/install-pinned-ffmpeg.sh --from-dockerfile Dockerfile --arch amd64
      - name: Pin npm version
        run: corepack enable npm && corepack prepare npm@11.12.1 --activate
      - name: Install dependencies
        run: npm ci
      - name: Restore shared packages
        id: build-packages
        uses: ./.github/actions/restore-ci-build
        with:
          kind: packages
      - name: Characterization check (decoded-output goldens)
        working-directory: backend
        run: npm run characterize:check
