# PR-time half of the private-marker gate. The publish path
# (scripts/publish-to-public.sh, run nightly by mirror-to-public.yml) aborts
# when a tracked file contains a string from the private marker list. That list
# exists only as a repo secret, so an author could not run the gate before
# merging: a hit first surfaced as a failed nightly publish, after the merge.
# This job runs the SAME script, scripts/check-private-markers.sh, on every PR
# into dev and main. A hit names only `marker #N` and the offending files —
# marker values are never printed.
#
# A second step reads the PR's COMMITS rather than its tree
# (tools/check-history-surface.mjs): the lines each adds, the paths it writes,
# its message, and the PR title (the squash commit's subject), against the
# marker and symbol lists and the public-surface categories. The mirror
# publishes history, so a line added and later removed still goes public.
# `edited` re-runs it on a retitle.
name: private-marker-check
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      range:
        description: "rev-list arguments for the history check (e.g. origin/dev~50..origin/dev); empty skips it"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: private-marker-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    name: Private Marker Gate
    # The list is a secret of the internal repo only. This file is mirrored to
    # the public repo, which never has it; with the list hard-required below,
    # every PR there would fail for a reason no one there can fix.
    if: github.repository == 'nodaroai/app.nodaro.ai-internal'
    runs-on: ubuntu-latest
    env:
      # GitHub does not pass repository secrets to PRs from forks.
      FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Skip PRs from forks (no access to the marker list)
        if: env.FROM_FORK == 'true'
        run: |
          echo "::notice title=Private Marker Gate skipped::This PR comes from a fork, and GitHub does not pass repository secrets to fork PRs, so the private marker list is unavailable here. The publish-time gate still checks the tree after merge."
      - uses: actions/checkout@v4
        if: env.FROM_FORK != 'true'
        with:
          # The tree to scan: the PR's own head rather than the merge ref; on a
          # manual run, the chosen ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # The history check needs the base branch and every commit since it.
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: env.FROM_FORK != 'true'
        with:
          # The gate itself comes from the protected base branch, never from the
          # PR: a branch cut before the gate existed has no copy of it, and a PR
          # must not be able to change the check it is judged by. It lands in an
          # untracked subdirectory, so the scan below never sees it.
          ref: ${{ github.base_ref || github.ref_name }}
          path: .gate-base
          sparse-checkout: |
            scripts/check-private-markers.sh
            tools/check-history-surface.mjs
            tools/check-public-surface.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check tracked files for private markers
        if: env.FROM_FORK != 'true'
        env:
          PRIVATE_LEAK_MARKERS: ${{ secrets.PRIVATE_LEAK_MARKERS }}
          # A missing or empty secret fails loudly instead of passing silently.
          MIRROR_REQUIRE_MARKERS: "1"
        # Run from the PR checkout's root: the script scans the repository it is
        # started in (git rev-parse --show-toplevel), not the one it lives in.
        # The base branch's copy is the gate. Only while a base branch has no
        # copy yet (the first promotion after the gate was added, e.g. the first
        # dev -> main PR) does the PR's own copy stand in; once the base has
        # it, a PR can never substitute its own.
        run: |
          gate=.gate-base/scripts/check-private-markers.sh
          if [ ! -f "$gate" ] && [ -f scripts/check-private-markers.sh ]; then
            echo "::notice title=Private Marker Gate::The base branch has no copy of the gate yet, so this PR's copy runs once."
            gate=scripts/check-private-markers.sh
          fi
          bash "$gate"
      - uses: actions/setup-node@v4
        if: env.FROM_FORK != 'true'
        with:
          node-version: 22
      - name: Check every commit this PR adds, and its title, for never-public content
        if: env.FROM_FORK != 'true'
        env:
          PRIVATE_LEAK_MARKERS: ${{ secrets.PRIVATE_LEAK_MARKERS }}
          MIRROR_REQUIRE_MARKERS: "1"
          PRIVATE_LEAK_SYMBOLS: ${{ secrets.PRIVATE_LEAK_SYMBOLS }}
          PRIVATE_LEAK_REQUIRE_SYMBOLS: "1"
          HISTORY_CHECKS: surface,internal-docs,markers,symbols
          # Via env, never inline ${{ }} in the script: the title and the range
          # are user-controlled input (script-injection surface).
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.base_ref }}
          RANGE: ${{ inputs.range }}
        # Same base-branch-first rule as the tree gate above.
        run: |
          gate=.gate-base/tools/check-history-surface.mjs
          if [ ! -f "$gate" ] && [ -f tools/check-history-surface.mjs ]; then
            echo "::notice title=History check::The base branch has no copy of the gate yet, so this PR's copy runs once."
            gate=tools/check-history-surface.mjs
          fi
          if [ -n "$BASE" ]; then
            git rev-parse --verify --quiet "origin/$BASE^{commit}" > /dev/null
            revs=("origin/$BASE..HEAD")
          elif [ -n "$RANGE" ]; then
            read -ra revs <<< "$RANGE"
          else
            echo "(no PR base and no range input — the history check is skipped)"
            exit 0
          fi
          node "$gate" "${revs[@]}"
