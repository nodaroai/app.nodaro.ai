name: Community Image

# Builds + publishes the prebuilt Community edition image so `docker compose
# up` on a fresh machine PULLS instead of compiling for 5-10 minutes.
#
# Runs ONLY in the public mirror (nodaroai/app.nodaro.ai) — same pattern as
# the npm publish workflow: the internal repo always skips, the mirror sync
# carries this file over, and the package publishes from public code only.
#
# EACH ARCH BUILDS ON ITS OWN NATIVE RUNNER, then a merge job stitches the
# two digests into one multi-arch tag. The previous single-job QEMU build
# failed twice in a row at the same step — `npm ci` in the linux/arm64 leg,
# ~6 minutes in, with npm's "network" error. Emulated arm64 is slow enough
# that npm's registry calls time out, so it is not flaky luck, it is the
# emulation. GitHub's ubuntu-24.04-arm runners are free for public repos and
# remove the emulation entirely (they also cut the build from ~1h to minutes).
#
# The baked VITE_* values are the community-compose localhost defaults (the
# frontend inlines them at build time — root CLAUDE.md Deployment rule). A
# deployment on a real domain, or one with fresh minted keys, rebuilds
# locally: docker compose -f docker-compose.community.yml build.
#
# ONE-TIME manual step after the first successful publish: flip the ghcr
# package visibility to Public (org → Packages → nodaro-community →
# settings) — GitHub creates it private by default and anonymous pulls 403
# until then.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "backend/**"
      - "frontend/**"
      - "packages/**"
      - "supabase/migrations/**"
      - ".github/workflows/community-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nodaroai/nodaro-community

jobs:
  # Resolve THE version for this commit — the exact `vX.Y.Z` tag app-release
  # puts on it. The tag is pushed to this (public) repo seconds AFTER the
  # mirror pushes main (mirror first, always: pushing a tag whose commit is
  # not yet on the mirror would smuggle main past the leak-gated publish
  # path), so this job polls briefly for it. If it never arrives (e.g. the
  # release's public half failed), the build still ships `:latest`+`:sha` but
  # SKIPS the version tags — an untagged build must not overwrite a version
  # tag, which is exactly the immutability bug this replaced (v1.23.0 was
  # re-pushed for six months).
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.ver.outputs.app_version }}
      exact: ${{ steps.ver.outputs.exact }}
      full: ${{ steps.ver.outputs.full }}
      minor: ${{ steps.ver.outputs.minor }}
      major: ${{ steps.ver.outputs.major }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for this commit's version tag
        id: ver
        run: |
          set -euo pipefail
          tag=""
          for _ in $(seq 1 20); do
            git fetch --tags --force --quiet origin
            tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            [ -n "$tag" ] && break
            sleep 15
          done
          if [ -n "$tag" ]; then
            v=${tag#v}
            {
              echo "exact=true"
              echo "app_version=$v"
              echo "full=v$v"
              echo "minor=v${v%.*}"
              echo "major=v${v%%.*}"
            } >> "$GITHUB_OUTPUT"
            echo "exact release tag: $tag"
          else
            near=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || echo v0.0.0)
            sha=$(git rev-parse --short HEAD)
            {
              echo "exact=false"
              echo "app_version=${near#v}-dev.$sha"
            } >> "$GITHUB_OUTPUT"
            echo "no exact tag on HEAD after 5 min — shipping :latest/:sha only (version ${near#v}-dev.$sha)"
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    if: github.repository == 'nodaroai/app.nodaro.ai'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest only; the merge job below creates the tags. Without
      # this, two jobs pushing the same tag would race and the last writer
      # would win with a single-arch image.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.app_version }}
            VITE_APP_VERSION=${{ needs.version.outputs.app_version }}
            VITE_API_URL=http://localhost:3000
            VITE_EDITION=community
            VITE_SUPABASE_URL=http://localhost:3000/supabase
            VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzU0Nzg0MDAwLCJleHAiOjIwNzAxNDQwMDB9.Z1_aDD7opHbwv6f8yrHK0ptlIM2tg1ulhXsggLuDyqo
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Per-arch cache scopes: one shared scope would have the two jobs
          # overwrite each other's layers every run.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch tags
    if: github.repository == 'nodaroai/app.nodaro.ai'
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Version tags (immutable vX.Y.Z + floating vX.Y and vX — the
      # quickstart pins :vX so majors never arrive unannounced) only when the
      # commit carries its release tag; :latest and :sha always.
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # SC2046: the word splitting is the point — one argument per digest
          # file, which is how imagetools is told what to stitch together.
          # shellcheck disable=SC2046
          if [ "${{ needs.version.outputs.exact }}" = "true" ]; then
            docker buildx imagetools create \
              -t ${{ env.IMAGE }}:latest \
              -t ${{ env.IMAGE }}:${{ github.sha }} \
              -t ${{ env.IMAGE }}:${{ needs.version.outputs.full }} \
              -t ${{ env.IMAGE }}:${{ needs.version.outputs.minor }} \
              -t ${{ env.IMAGE }}:${{ needs.version.outputs.major }} \
              $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          else
            docker buildx imagetools create \
              -t ${{ env.IMAGE }}:latest \
              -t ${{ env.IMAGE }}:${{ github.sha }} \
              $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          fi

      - name: Inspect published image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:latest
