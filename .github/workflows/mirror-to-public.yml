# Nightly gated mirror: internal → public. BUFFERED (scheduled), not per-commit,
# so there's a catch-window before anything is irreversibly public. The job runs
# the leak + secret gate and prints the pending internal→public diff (the "glance"
# record for the window). Manual "publish now" override via the Actions Run button.
# Publishing is token-guarded: until PUBLIC_MIRROR_TOKEN is set it gates + logs the
# delta but does not push. Gate logic lives in scripts/publish-to-public.sh (single
# source, shared with the manual path) so the two can't drift.
name: mirror-to-public
on:
  schedule:
    - cron: '23 3 * * *'   # nightly ~03:23 UTC (off the hour to dodge scheduler load; configurable)
  workflow_dispatch: {}     # manual "publish now" override
# issues: write powers the failure-alert step (auto-issue) — the Jul 11-13
# outage went unnoticed for 3 days because the nightly run failed silently.
permissions: { contents: read, issues: write }
concurrency:
  group: mirror-to-public
  cancel-in-progress: false
jobs:
  gate-and-mirror:
    # Internal repo only — the public mirror must never mirror to itself.
    if: github.repository == 'nodaroai/app.nodaro.ai-internal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: install gitleaks (secret gate)
        run: |
          set -euo pipefail
          VER=8.30.1
          # Pin + verify the gitleaks release artifact (supply-chain integrity):
          # sha256 from the official gitleaks_${VER}_checksums.txt. A mismatch
          # fails the step — but the pinned artifact is immutable, so an occasional
          # mismatch is a corrupted download in transit, not a tamper. Retry the
          # download+verify up to 3× so one flaky fetch can't fail the secret gate
          # and — because this run is a required check on main — silently make
          # Railway SKIP the production deploy (happened 2026-08-27, PR #1010).
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          for attempt in 1 2 3; do
            curl -sSL -o gitleaks.tar.gz "$URL" || true
            # `if` condition is exempt from `set -e`, so a mismatch retries here
            # rather than aborting the step; the SHA is re-checked every attempt.
            if echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -; then
              break
            fi
            rm -f gitleaks.tar.gz
            if [ "$attempt" = 3 ]; then
              echo "gitleaks download failed checksum after 3 attempts" >&2
              exit 1
            fi
            echo "gitleaks download failed checksum (attempt ${attempt}/3); retrying…" >&2
            sleep $((attempt * 3))
          done
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      # The nodaro-mirror GitHub App, installed on the public repo only, is the
      # one identity public main and dev accept updates from (repository
      # ruleset), so neither a person nor a PR merge can put a commit there that
      # internal lacks. Until its client id is configured, the push uses the token.
      - name: mint the nodaro-mirror App token
        id: app-token
        if: vars.PUBLIC_MIRROR_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PUBLIC_MIRROR_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLIC_MIRROR_APP_KEY }}
          owner: nodaroai
          repositories: app.nodaro.ai
          permission-contents: write
          # The mirror carries .github/workflows/* changes, and GitHub refuses an
          # App push that touches a workflow file without this permission.
          permission-workflows: write
      - name: gate + mirror main and dev
        id: mirror
        env:
          TOK: ${{ steps.app-token.outputs.token || secrets.PUBLIC_MIRROR_TOKEN }}
          GH_TOK: ${{ github.token }}
          # Private-marker gate input (see publish-to-public.sh): newline-separated
          # strings that must never publish. The nightly path HARD-REQUIRES the list
          # so a lost secret fails loudly instead of silently skipping the gate.
          PRIVATE_LEAK_MARKERS: ${{ secrets.PRIVATE_LEAK_MARKERS }}
          MIRROR_REQUIRE_MARKERS: "1"
          # Private-symbol deny-list (see tools/check-private-leaks.mjs) — also
          # secret-held, and hard-required here so the publish path can never
          # lose the gate by losing the secret.
          PRIVATE_LEAK_SYMBOLS: ${{ secrets.PRIVATE_LEAK_SYMBOLS }}
          PRIVATE_LEAK_REQUIRE_SYMBOLS: "1"
        run: |
          # actions/checkout persists a github.com-wide Authorization header using
          # GITHUB_TOKEN (scoped to THIS/internal repo). It overrides our per-URL
          # creds on every github.com git op, so pushing to the PUBLIC repo auths as
          # GITHUB_TOKEN → "Repository not found". Clear it, and re-point origin at an
          # explicit token URL so internal fetches still work.
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git remote set-url origin "https://x-access-token:${GH_TOK}@github.com/${GITHUB_REPOSITORY}.git"
          if [ -n "${TOK:-}" ]; then
            TOK=$(printf '%s' "$TOK" | tr -d '[:space:]')   # strip stray newline/whitespace from the secret (PATs have none)
            echo "token access check: HTTP $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token ${TOK}" https://api.github.com/repos/nodaroai/app.nodaro.ai) — 200=has access, 404=invalid/no access"
            # The token rides in a header scoped to the public repo's URL, never in
            # the URL itself: since 2026-10-21 GitHub answers the runners' git calls
            # with a redirect, and git drops URL credentials when it follows one —
            # every push failed "could not read Username" with a valid token. A
            # URL-matched header is sent on the redirected requests too.
            echo "::add-mask::$(printf 'x-access-token:%s' "$TOK" | base64 -w0)"
            git config --local http.https://github.com/nodaroai/app.nodaro.ai.git.extraheader \
              "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOK" | base64 -w0)"
            export PUBLIC_REMOTE="https://github.com/nodaroai/app.nodaro.ai.git"
          else
            echo "PUBLIC_MIRROR_TOKEN not set — running gate-only (dry run), no publish."
            echo "Add the token (fine-grained PAT, Contents:RW on nodaroai/app.nodaro.ai) to enable nightly auto-publish."
            export MIRROR_DRY_RUN=1
            export PUBLIC_REMOTE="https://github.com/nodaroai/app.nodaro.ai.git"
          fi
          # A diverged public branch (exit 3) is reported, not failed: this run
          # is a check on main, and a red one makes Railway skip the production
          # deploy, which is not the public repo's call to make (decided
          # 2026-10-25). A gate failure (any other code) still fails the run.
          DIVERGED=""
          for BR in main dev; do
            rc=0
            bash scripts/publish-to-public.sh "$BR" || rc=$?
            if [ "$rc" = 3 ]; then
              DIVERGED="$DIVERGED $BR"
              echo "::warning::public/$BR has diverged from internal/$BR and was not mirrored; adopt the public commit(s) into internal (merge public/$BR into dev on a PR)."
            elif [ "$rc" != 0 ]; then
              exit "$rc"
            fi
          done
          echo "diverged=${DIVERGED# }" >> "$GITHUB_OUTPUT"
      # The Jul 11-13 outage: three consecutive nightly failures, zero alerts,
      # while blocked commits were hand-pushed around the gate. One open issue
      # per outage (deduped by label), a comment per subsequent failure.
      - name: alert on failure (auto-issue)
        if: failure() || steps.mirror.outputs.diverged != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DIVERGED: ${{ steps.mirror.outputs.diverged }}
        run: |
          set -euo pipefail
          WHY="The gated mirror failed"
          if [ -n "$DIVERGED" ]; then
            WHY="The gated mirror could not fast-forward public ${DIVERGED}: it carries commit(s) internal lacks. Adopt them into internal (merge the public branch into dev on a PR, with a merge commit)"
          fi
          gh label create mirror-failure --repo "$GITHUB_REPOSITORY" --color B60205 --description "mirror-to-public run failed" --force 2>/dev/null || true
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --label mirror-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "Again: ${WHY}. $RUN_URL"
          else
            BODY=$(printf '%s: %s\n\nUntil this is green, nothing reaches the public repo (and npm publishes stay stuck behind it). Check the run log for the gate that tripped (identity / leaks / secrets / ancestry). Close this issue when a run succeeds.' "$WHY" "$RUN_URL")
            gh issue create --repo "$GITHUB_REPOSITORY" --label mirror-failure \
              --title "mirror-to-public is failing — public mirror is falling behind" \
              --body "$BODY"
          fi
