<!DOCTYPE html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Visual workflow platform for AI video generation" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=11" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=11" />
    <link rel="icon" href="/favicon.ico?v=11" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo-192.png?v=11" />
    <link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <title>Nodaro.ai</title>
    <!-- Runtime config: start.sh writes /config.js from the container's env at
         boot (PUBLIC_URL, the browser-facing Supabase URL, the anon key) so one
         published image serves any port or domain without a rebuild. A classic
         script on purpose — it must run before the (deferred) module entry
         reads it; src/lib/runtime-config.ts falls back to the build-time value
         when a key is absent. In dev/plain builds public/config.js is empty. -->
    <script src="/config.js"></script>
    <!-- Deployment surface profile (B1): apply the brand product name to the
         document title before paint, from the same runtime object. Runtime-cheap
         (no rebuild); the wordmark itself is React (surfaceBrandName). -->
    <script>
      (function () {
        try {
          var s = (window.__NODARO_RUNTIME__ || {}).surface;
          if (s && s.brand && s.brand.productName) document.title = s.brand.productName;
          if (s && s.brand && s.brand.description) {
            var m = document.querySelector('meta[name="description"]');
            if (m) m.setAttribute("content", s.brand.description);
          }
        } catch (e) {}
      })();
    </script>
    <!-- External SSO (B6): the exchange route redirects to /sso?sso_token=…&next=…
         The @supabase/supabase-js browser client boots with
         flowType:"pkce" + detectSessionInUrl:true, which scans the URL for an
         auth token as soon as any module loads — before the /sso route mounts.
         Stash the one-time token + next into a global and STRIP them from the
         URL (history.replaceState) so the token never reaches the PKCE
         auto-detector, browser history, or any logger. Non-obvious — do not
         remove: without it the landing route finds an empty URL. -->
    <script>
      (function () {
        try {
          if (window.location.pathname !== "/sso") return;
          var q = new URLSearchParams(window.location.search);
          var token = q.get("sso_token");
          if (!token) return;
          var next = q.get("next") || "/projects";
          if (next.indexOf("/") !== 0 || next.indexOf("//") === 0) next = "/projects";
          window.__NODARO_SSO__ = { token: token, next: next };
          window.history.replaceState({}, "", "/sso");
        } catch (e) {}
      })();
    </script>
    <!-- Analytics (Microsoft Clarity + Google Tag Manager) — opt-in via
         build-time env (VITE_CLARITY_ID / VITE_GTM_ID); empty/unset (the
         self-hosted Community/Business default) is a no-op and nothing leaves
         the deployment. The container is the SAME one nodaro.ai, studio,
         person and tools load (GA4 is a tag INSIDE it; no gtag snippet and no
         second measurement id here on purpose, so every Google tag stays
         managed in one place and the GA cookie stays shared across the
         subdomains). Clarity is loaded here, not from the container, on every
         Nodaro surface alike — one project, so the recordings read as one
         application. Loaded on the first-party dashboard ONLY: skipped inside
         iframes and on public app/present/embed/share/profile surfaces so that
         customer-embedded widgets don't load Clarity session recording + GA.
         Keep the public-surface prefix list in sync with the routes in
         src/router.tsx. No <noscript> container fallback: static markup could
         not honour those gates, and this SPA renders nothing without JS. -->
    <script>
      (function () {
        // Bail out when rendered inside an iframe (embeds): a cross-origin
        // access on window.top throws, which also means we're framed.
        try {
          if (window.self !== window.top) return;
        } catch (e) {
          return;
        }
        // Bail out on public/embed/app-runner/present/share/profile surfaces.
        if (
          /^\/(app|present|embed|g|static-share|u)(\/|$)/.test(
            window.location.pathname,
          )
        ) {
          return;
        }

        // A page another Nodaro surface prerendered may never be shown:
        // start analytics only once it is (src/lib/prerender.ts, same rule).
        if (document.prerendering) {
          document.addEventListener("prerenderingchange", startAnalytics, { once: true });
        } else {
          startAnalytics();
        }

        function startAnalytics() {
          var clarityId = "%VITE_CLARITY_ID%";
          var gtmId = "%VITE_GTM_ID%";
          // Treat empty or unsubstituted ("%VITE_…%") values as disabled.
          var unset = function (v) { return !v || v.charAt(0) === "%"; };

          // PRODUCTION HOST ONLY, mirroring studio.nodaro.ai/index.html. The env
          // guard above is not enough on its own: a VITE_* value that reaches a
          // local build sends dev traffic to the live GA4 property and into the
          // Clarity recordings. A hostname check cannot regress via env config.
          var isProdHost = window.location.hostname === "app.nodaro.ai";

          // Microsoft Clarity
          if (!unset(clarityId) && isProdHost) {
            (function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);})(window,document,"clarity","script",clarityId);
          }

          // Google Tag Manager. `dataLayer` is created either way so anything
          // that pushes to it always has somewhere to go.
          window.dataLayer = window.dataLayer || [];
          if (!unset(gtmId) && isProdHost) {
            (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
            new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
            j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
            'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
            })(window,document,'script','dataLayer',gtmId);
          }
        }
      })();
    </script>
  </head>
  <body class="antialiased" style="overscroll-behavior-y:contain">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
